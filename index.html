// Evolved from interactive-formulas rain.js (v0.11).
// Pitch 14, glyph 13, gap 14, head #d9ffc3, trail #83c79d.
// frameMs is the motion timebase (how far a column used to move per 60 ms
// tick), not a frame cap. Columns spell whole grapheme clusters.
// Each mantra is drawn once into a strip and blitted, so a wide window
// does not call fillText for every glyph on every frame.
const RAIN = {
  columnPitch: 14,
  fontSize: 13,
  glyphGap: 14,
  minTrail: 36,
  head: "#d9ffc3",
  body: "#83c79d",
  frameMs: 60
};

function startRain(opts) {
  const canvas = opts.canvas;
  const button = opts.button;
  const ctx = canvas.getContext("2d");
  const media = matchMedia("(prefers-reduced-motion: reduce)");
  let paused = media.matches;
  let width = 0;
  let height = 0;
  let columns = [];
  let last = 0;
  let strips = {};
  let rainDpr = 1;

  function trailLength(h) {
    return Math.max(RAIN.minTrail, Math.ceil(h / RAIN.glyphGap));
  }

  function fillGlyphs(mantra, trail) {
    const seq = opts.sequences[mantra];
    const glyphs = new Array(trail);
    for (let i = 0; i < trail; i++) {
      const fromTop = trail - 1 - i;
      glyphs[i] = seq[fromTop % seq.length];
    }
    return glyphs;
  }

  function strip(mantra, trail, alphaScale) {
    const key = mantra + ":" + trail + ":" + alphaScale + ":" + rainDpr;
    if (strips[key]) return strips[key];
    const glyphs = fillGlyphs(mantra, trail);
    const w = RAIN.columnPitch;
    const h = trail * RAIN.glyphGap + RAIN.fontSize;
    const image = document.createElement("canvas");
    image.width = Math.max(1, Math.round(w * rainDpr));
    image.height = Math.max(1, Math.round(h * rainDpr));
    const pen = image.getContext("2d");
    pen.setTransform(rainDpr, 0, 0, rainDpr, 0, 0);
    pen.font = RAIN.fontSize + 'px "Rain Devanagari", serif';
    pen.textAlign = "center";
    for (let i = 0; i < glyphs.length; i++) {
      const base = Math.max(0.08, (1 - i / (glyphs.length + 1)) * 0.85);
      pen.globalAlpha = Math.min(1, base * alphaScale);
      pen.fillStyle = i === 0 ? RAIN.head : RAIN.body;
      pen.fillText(glyphs[i], w / 2, trail * RAIN.glyphGap - i * RAIN.glyphGap);
    }
    strips[key] = image;
    return image;
  }

  function makeColumns() {
    const count = Math.max(0, Math.ceil(width / RAIN.columnPitch));
    const trail = trailLength(height);
    columns = [];
    for (let i = 0; i < count; i++) {
      const mantra = (i % 3) + 1;
      columns.push({
        x: i * RAIN.columnPitch + RAIN.columnPitch / 2,
        y: Math.random() * (height + trail * RAIN.glyphGap) - trail * RAIN.glyphGap,
        speed: 0.7 + Math.random() * 1.6,
        mantra: mantra
      });
    }
  }

  function resize() {
    width = innerWidth;
    height = innerHeight;
    rainDpr = 1;
    strips = {};
    canvas.width = Math.round(width * rainDpr);
    canvas.height = Math.round(height * rainDpr);
    ctx.setTransform(rainDpr, 0, 0, rainDpr, 0, 0);
    makeColumns();
    draw(RAIN.frameMs);
  }

  function draw(dt) {
    const scale = opts.scales();
    const speedScale = scale.speed / 1000;
    const alphaScale = scale.alpha / 1000;
    const stride = scale.stride || 1;
    const step = dt / RAIN.frameMs;
    ctx.clearRect(0, 0, width, height);
    const trail = trailLength(height);
    const stripH = trail * RAIN.glyphGap + RAIN.fontSize;
    for (let c = 0; c < columns.length; c++) {
      const column = columns[c];
      column.y += column.speed * 3.2 * speedScale * step;
      if (column.y - trail * RAIN.glyphGap > height) {
        column.y = -RAIN.glyphGap;
        column.mantra = (column.mantra % 3) + 1;
      }
      if (c % stride !== 0) continue;
      const image = strip(column.mantra, trail, alphaScale);
      ctx.drawImage(
        image,
        column.x - RAIN.columnPitch / 2,
        column.y - trail * RAIN.glyphGap,
        RAIN.columnPitch,
        stripH
      );
    }
  }

  function refreshLabels() {
    const labels = opts.labels();
    button.textContent = paused ? labels.play : labels.pause;
    button.setAttribute("aria-pressed", String(paused));
  }

  function frame(time) {
    if (!paused && !document.hidden) {
      const dt = last === 0 ? RAIN.frameMs : Math.min(48, time - last);
      last = time;
      draw(dt);
    }
    requestAnimationFrame(frame);
  }

  button.addEventListener("click", function () {
    paused = !paused;
    refreshLabels();
  });
  media.addEventListener("change", function (event) {
    paused = event.matches;
    refreshLabels();
  });
  addEventListener("resize", resize);
  resize();
  document.fonts.load(RAIN.fontSize + 'px "Rain Devanagari"').then(function () {
    strips = {};
    draw(0);
  });
  refreshLabels();
  requestAnimationFrame(frame);

  return {
    refreshLabels: refreshLabels,
    isPaused: function () { return paused; },
    prefersReduced: function () { return media.matches; }
  };
}

// Browser-only Sidpa wind and clicks. No audio files.
// The context is created on the Sound tap, never before.
let audio = null;
let windGain = null;
let soundOn = false;
const reducedSound = matchMedia("(prefers-reduced-motion: reduce)");

function soundEnabled() {
  return soundOn;
}

function ensureAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audio = new Ctx();
  const rate = audio.sampleRate;
  const buffer = audio.createBuffer(1, rate * 2, rate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const source = audio.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  const filter = audio.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 240;
  windGain = audio.createGain();
  windGain.gain.value = 0;
  source.connect(filter);
  filter.connect(windGain);
  windGain.connect(audio.destination);
  source.start();
}

function setWind(active) {
  if (!windGain || !audio) return;
  const level = soundOn && active && !reducedSound.matches ? 0.028 : 0;
  windGain.gain.setTargetAtTime(level, audio.currentTime, 0.15);
}

function setSound(on) {
  soundOn = on;
  if (on) {
    ensureAudio();
    audio.resume();
  }
  setWind(false);
}

function playClick() {
  if (!soundOn || !audio || reducedSound.matches) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = "sine";
  osc.frequency.value = 440;
  gain.gain.setValueAtTime(0.035, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + 0.06);
}

reducedSound.addEventListener("change", function () {
  if (reducedSound.matches) setWind(false);
});

// Painted scenes. Everything is drawn in code inside a centred 3:4 stage
// so a wide window letterboxes instead of stretching strokes to the edges.
let regions = [];
let originX = 0;
let originY = 0;
let bg = null;
let bgKey = "";
let regionKey = "";

const REALM_WASH = {
  deva: "#c9c3b5",
  asura: "#4a5e48",
  human: "#a89a55",
  animal: "#3a4a62",
  preta: "#7a4548",
  hell: "#5c5550"
};

function stageBox(width, height, opening, ending) {
  const bar = 72;
  const caption = opening ? 108 : ending ? 168 : 56;
  const top = 40;
  const availW = Math.max(40, width - 16);
  const availH = Math.max(40, height - bar - caption - top);
  const aspect = 3 / 4;
  let w = availW;
  let h = w / aspect;
  if (h > availH) {
    h = availH;
    w = h * aspect;
  }
  return {
    x: (width - w) / 2,
    y: top + Math.max(0, (availH - h) / 2),
    w: w,
    h: h
  };
}

function addDisc(action, arg, x, y, r) {
  regions.push({ kind: "disc", action: action, arg: arg, x: originX + x, y: originY + y, r: r });
}

function ridge(ctx, pts, colour) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = colour;
  ctx.fill();
}

function cloud(ctx, x, y, r) {
  ctx.fillStyle = "rgba(244, 240, 228, 0.9)";
  ctx.beginPath();
  ctx.ellipse(x, y, r, r * 0.42, 0, 0, Math.PI * 2);
  ctx.ellipse(x - r * 0.45, y + r * 0.08, r * 0.55, r * 0.32, 0, 0, Math.PI * 2);
  ctx.ellipse(x + r * 0.4, y + r * 0.06, r * 0.5, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
}

function waterfall(ctx, x, y, len) {
  const w = Math.max(10, len * 0.09);
  ctx.fillStyle = "rgba(236, 242, 236, 0.9)";
  ctx.fillRect(x, y, w, len);
  ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
  ctx.fillRect(x + w * 0.35, y, w * 0.25, len);
}

function drawLandscape(ctx, w, h, nearer) {
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#efe2c4");
  sky.addColorStop(0.42, "#d5dcc8");
  sky.addColorStop(1, "#7f917f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  cloud(ctx, w * 0.22, h * 0.14, w * 0.16);
  cloud(ctx, w * 0.7, h * 0.11, w * 0.14);
  ridge(ctx, [
    [0, h * 0.46], [w * 0.1, h * 0.3], [w * 0.2, h * 0.48],
    [w * 0.3, h * 0.34], [w * 0.38, h * 0.52], [w * 0.2, h], [0, h]
  ], "#8ea090");
  ridge(ctx, [
    [w, h * 0.44], [w * 0.88, h * 0.28], [w * 0.76, h * 0.5],
    [w * 0.64, h * 0.33], [w * 0.56, h * 0.54], [w * 0.76, h], [w, h]
  ], "#6e7f72");
  waterfall(ctx, w * 0.14, h * 0.38, h * 0.2);
  waterfall(ctx, w * 0.84, h * 0.36, h * 0.18);
  if (nearer) {
    ridge(ctx, [
      [0, h * 0.7], [w * 0.14, h * 0.56], [w * 0.26, h * 0.72], [w * 0.12, h], [0, h]
    ], "#3f5348");
    ridge(ctx, [
      [w, h * 0.68], [w * 0.84, h * 0.54], [w * 0.7, h * 0.7], [w * 0.86, h], [w, h]
    ], "#31443c");
  }
  ctx.fillStyle = "#c9d2c4";
  ctx.beginPath();
  ctx.ellipse(w * 0.5, h * 0.8, w * 0.2, h * 0.035, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBuddha(ctx, cx, cy, s) {
  ctx.fillStyle = "#c47a8a";
  ctx.beginPath();
  ctx.ellipse(cx, cy + s * 0.4, s * 0.5, s * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#e7b4c0";
  ctx.beginPath();
  ctx.ellipse(cx - s * 0.28, cy + s * 0.38, s * 0.18, s * 0.07, -0.5, 0, Math.PI * 2);
  ctx.ellipse(cx + s * 0.28, cy + s * 0.38, s * 0.18, s * 0.07, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#e0c36a";
  ctx.beginPath();
  ctx.ellipse(cx, cy + s * 0.28, s * 0.32, s * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#a33b32";
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.32, cy + s * 0.24);
  ctx.lineTo(cx + s * 0.32, cy + s * 0.24);
  ctx.lineTo(cx + s * 0.18, cy - s * 0.02);
  ctx.lineTo(cx - s * 0.18, cy - s * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.18, cy);
  ctx.quadraticCurveTo(cx - s * 0.24, cy - s * 0.24, cx - s * 0.1, cy - s * 0.34);
  ctx.lineTo(cx + s * 0.1, cy - s * 0.34);
  ctx.quadraticCurveTo(cx + s * 0.24, cy - s * 0.24, cx + s * 0.18, cy);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#e0c36a";
  ctx.fillRect(cx - s * 0.12, cy - s * 0.18, s * 0.24, s * 0.055);
  ctx.fillStyle = "#e6c48a";
  ctx.beginPath();
  ctx.ellipse(cx - s * 0.15, cy - s * 0.46, s * 0.035, s * 0.07, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + s * 0.15, cy - s * 0.46, s * 0.035, s * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy - s * 0.48, s * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy - s * 0.6, s * 0.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#8a6238";
  ctx.fillRect(cx - s * 0.055, cy - s * 0.51, s * 0.028, s * 0.012);
  ctx.fillRect(cx + s * 0.027, cy - s * 0.51, s * 0.028, s * 0.012);
  ctx.beginPath();
  ctx.ellipse(cx, cy - s * 0.04, s * 0.09, s * 0.04, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawHalo(ctx, cx, cy, r, time) {
  const colours = ["#a33b32", "#c47a3a", "#e0c36a", "#6e8f62", "#6a7f92"];
  const shimmer = 0.45 + 0.2 * Math.sin(time / 650);
  const glow = ctx.createRadialGradient(cx, cy, r * 0.05, cx, cy, r);
  glow.addColorStop(0, "rgba(224, 195, 106, " + (0.35 + 0.1 * Math.sin(time / 500)) + ")");
  glow.addColorStop(1, "rgba(224, 195, 106, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  colours.forEach(function (colour, i) {
    ctx.beginPath();
    ctx.strokeStyle = colour;
    ctx.globalAlpha = shimmer;
    ctx.lineWidth = Math.max(3, r * 0.04);
    ctx.arc(cx, cy, r * (0.62 + i * 0.07), Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function paintStatic(ctx, w, h, kind) {
  if (kind === "open") {
    drawLandscape(ctx, w, h, true);
    return;
  }
  if (kind === "mist") {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#d9d3c4");
    g.addColorStop(1, "#8a8d86");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    cloud(ctx, w * 0.3, h * 0.16, w * 0.18);
    cloud(ctx, w * 0.72, h * 0.2, w * 0.12);
    return;
  }
  drawLandscape(ctx, w, h, false);
}

function drawPetals(ctx, cx, cy, radius, done, time) {
  const next = done < 5 ? done : -1;
  for (let i = 0; i < 5; i++) {
    const sway = Math.sin(time / 800 + i) * 1.5;
    const angle = -Math.PI / 2 + i * (Math.PI * 2 / 5);
    const px = cx + Math.cos(angle) * radius * 0.58;
    const py = cy + Math.sin(angle) * radius * 0.58;
    ctx.save();
    ctx.translate(px + sway, py);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 0.36, radius * 0.18, 0, 0, Math.PI * 2);
    ctx.closePath();
    if (i < done) ctx.fillStyle = "#3f6b48";
    else if (i === next) ctx.fillStyle = "#e0c36a";
    else ctx.fillStyle = "#c47a8a";
    ctx.fill();
    ctx.restore();
    addDisc(1, i + 1, px, py, Math.max(28, radius * 0.22));
  }
  ctx.beginPath();
  ctx.arc(cx, cy, 16 + done * 6, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = done >= 5 ? "#f7f4ea" : "#e0c36a";
  ctx.fill();
}

function drawPlaces(ctx, cx, cy, radius) {
  const places = [
    [0, 3, 0, "#7f91a3"],
    [Math.PI / 2, 3, 1, "#c4a24a"],
    [Math.PI, 3, 2, "#a33b32"],
    [-Math.PI / 2, 3, 3, "#3f5348"],
    [Math.PI * 0.75, 2, 0, "#8e3a3a"],
    [Math.PI * 1.2, 2, 1, "#e0c36a"]
  ];
  places.forEach(function (place) {
    const dist = place[1] === 2 ? radius * 0.92 : radius * 1.18;
    const x = cx + Math.cos(place[0]) * dist;
    const y = cy + Math.sin(place[0]) * dist;
    ctx.fillStyle = place[3];
    ctx.beginPath();
    ctx.ellipse(x, y + 6, 18, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    addDisc(place[1], place[2], x, y, 26);
  });
}

function drawWheel(ctx, cx, cy, radius, bright) {
  const colours = ["#c9c3b5", "#4a5e48", "#a89a55", "#3a4a62", "#7a4548", "#5c5550"];
  for (let i = 0; i < 6; i++) {
    const a0 = -Math.PI / 2 + i * Math.PI / 3;
    const a1 = a0 + Math.PI / 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, a0, a1);
    ctx.closePath();
    ctx.fillStyle = colours[i];
    ctx.globalAlpha = bright === i ? 1 : 0.72;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (bright === i) {
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#e0c36a";
      ctx.stroke();
    }
    const mid = (a0 + a1) / 2;
    regions.push({
      kind: "sector", action: 4, arg: i,
      cx: originX + cx, cy: originY + cy, radius: radius, a0: a0, a1: a1,
      hitX: originX + cx + Math.cos(mid) * radius * 0.62,
      hitY: originY + cy + Math.sin(mid) * radius * 0.62
    });
  }
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = "#1c1c1c";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.1, 0, Math.PI * 2);
  ctx.fillStyle = "#e0c36a";
  ctx.fill();
}

function drawMirror(ctx, w, h) {
  const cx = w / 2;
  const cy = h * 0.46;
  const rx = w * 0.28;
  const ry = h * 0.24;
  ctx.fillStyle = "#e0c36a";
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx + 8, ry + 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f7f4ea";
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  addDisc(5, 0, cx, cy, Math.min(rx, ry) * 0.85);
  addDisc(8, 0, cx - rx - 22, cy, 28);
  addDisc(9, 0, cx + rx + 22, cy, 28);
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(cx - rx - 22, cy - 24 + i * 14, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#f4f1e6";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + rx + 22, cy - 24 + i * 14, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#1c1c1c";
    ctx.fill();
  }
  const py = cy + ry + 28;
  ctx.strokeStyle = "#5c5550";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, py, 12, 0, Math.PI * 2);
  ctx.stroke();
  addDisc(6, 0, cx, py, 22);
}

function drawRealmLight(ctx, w, h, screen) {
  const colour = REALM_WASH[screen] || "#a89a55";
  const cx = w / 2;
  const cy = h * 0.46;
  const r = Math.min(w, h) * 0.28;
  const glow = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.4);
  glow.addColorStop(0, colour);
  glow.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#e0c36a";
  ctx.lineWidth = 6;
  ctx.stroke();
}

function drawWishBody(ctx, w, h, model) {
  const colours = ["#f4f1e6", "#1c1c1c", "#a33b32"];
  const yA = h * 0.72;
  colours.forEach(function (colour, i) {
    const ax = w * (0.22 + i * 0.28);
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(ax, yA, 18, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    addDisc(7, i, ax, yA, 26);
  });
  const x = (model.x / 1000) * w;
  const y = (model.y / 1000) * (h * 0.45) + h * 0.12;
  const glow = ctx.createRadialGradient(x, y, 4, x, y, 36);
  glow.addColorStop(0, "rgba(244, 241, 230, 0.95)");
  glow.addColorStop(1, "rgba(244, 241, 230, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, 36, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f7f4ea";
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.fill();
}

function ensureBg(kind, box, dpr) {
  const paintKind = kind === "4" ? "mist" : kind === "open" ? "open" : "land";
  const key = paintKind + ":" + Math.round(box.w) + "x" + Math.round(box.h);
  const pw = Math.max(1, Math.round(box.w * dpr));
  const ph = Math.max(1, Math.round(box.h * dpr));
  if (!bg) bg = document.createElement("canvas");
  if (bgKey !== key || bg.width !== pw || bg.height !== ph) {
    bg.width = pw;
    bg.height = ph;
    const c = bg.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintStatic(c, box.w, box.h, paintKind);
    bgKey = key;
  }
  return bg;
}

function paintAll(time, model) {
  const canvas = document.getElementById("viz");
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  const width = window.innerWidth;
  const height = window.innerHeight;
  const pw = Math.max(1, Math.round(width * dpr));
  const ph = Math.max(1, Math.round(height * dpr));
  if (canvas.width !== pw || canvas.height !== ph) {
    canvas.width = pw;
    canvas.height = ph;
    bgKey = "";
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const box = stageBox(width, height, model.opening, model.ending);
  window.__stage = box;
  const kind = model.opening ? "open" : String(model.scene);
  const layer = ensureBg(kind, box, dpr);
  ctx.save();
  ctx.beginPath();
  ctx.rect(box.x, box.y, box.w, box.h);
  ctx.clip();
  ctx.drawImage(layer, box.x, box.y, box.w, box.h);
  ctx.translate(box.x, box.y);
  regions = [];
  originX = box.x;
  originY = box.y;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t = reduced ? 0 : time;
  if (model.opening) {
    const cx = box.w / 2;
    const cy = box.h * 0.52;
    const r = Math.min(box.w, box.h) * 0.42;
    drawHalo(ctx, cx, cy - box.h * 0.04, r, t);
    drawBuddha(ctx, cx, cy, Math.min(box.w, box.h) * 0.46);
  } else if (model.screen === "good") {
    const radius = Math.min(box.w, box.h) * 0.3;
    drawPetals(ctx, box.w / 2, box.h * 0.42, radius, 5, t);
  } else if (REALM_WASH[model.screen]) {
    drawRealmLight(ctx, box.w, box.h, model.screen);
  } else if (model.scene === 0) {
    paintAxesLocal(ctx, box.w, box.h, model);
  } else if (model.scene === 1) {
    const radius = Math.min(box.w, box.h) * 0.3;
    drawPlaces(ctx, box.w / 2, box.h * 0.48, radius);
    drawPetals(ctx, box.w / 2, box.h * 0.48, radius, model.methods, t);
  } else if (model.scene === 2) {
    drawWheel(ctx, box.w / 2, box.h * 0.46, Math.min(box.w, box.h) * 0.34, model.bright);
  } else if (model.scene === 3) {
    drawMirror(ctx, box.w, box.h);
  } else if (model.scene === 4) {
    drawWishBody(ctx, box.w, box.h, model);
  }
  ctx.restore();
  const key = [
    model.screen, model.methods, model.bright,
    Math.round(box.x), Math.round(box.y), Math.round(box.w), Math.round(box.h)
  ].join(":");
  if (key !== regionKey) {
    regionKey = key;
    const rect = canvas.getBoundingClientRect();
    window.__regions = regions.map(function (region) {
      const x = region.kind === "disc" ? region.x : region.hitX;
      const y = region.kind === "disc" ? region.y : region.hitY;
      return { action: region.action, arg: region.arg, clientX: rect.left + x, clientY: rect.top + y };
    });
  }
}

function paintAxesLocal(ctx, w, h, model) {
  const left = w * 0.12;
  const top = h * 0.16;
  const plotW = w * 0.76;
  const plotH = h * 0.62;
  ctx.strokeStyle = "#3f5348";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left, top + plotH);
  ctx.lineTo(left + plotW, top + plotH);
  ctx.stroke();
  function line(series, colour) {
    ctx.beginPath();
    ctx.strokeStyle = colour;
    ctx.lineWidth = 3;
    for (let d = 0; d <= 49; d++) {
      const x = left + (d / 49) * plotW;
      const y = top + plotH - ((series[d] || 0) / 1000) * plotH;
      if (d === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  line(model.curves.clarity, "#6e8f62");
  line(model.curves.intensity, "#c47a3a");
  line(model.curves.complexity, "#6a7f92");
}

function hitContains(region, x, y) {
  if (region.kind === "disc") {
    const dx = x - region.x;
    const dy = y - region.y;
    return dx * dx + dy * dy <= region.r * region.r;
  }
  const dx = x - region.cx;
  const dy = y - region.cy;
  const dist = Math.hypot(dx, dy);
  if (dist > region.radius || dist < region.radius * 0.18) return false;
  let ang = Math.atan2(dy, dx);
  const start = region.a0;
  while (ang < start) ang += Math.PI * 2;
  while (ang >= start + Math.PI * 2) ang -= Math.PI * 2;
  return ang >= start && ang <= region.a1;
}

  if (side[3] >= 0) destination = side[3];
  if (side[6] >= 0) poisonSeen = side[6];
  return output();
}

  if (viewMode === "opening" || screenId === "opening") return "title";

  if (REALM_INFO[screenId]) return REALM_INFO[screenId];
  if (screenId === "wish" && turned) return "infoWishTurn";
  if (scene === 1 || screenId === "womb") return "infoWomb";
  if (scene === 2 || screenId === "lights") return "infoLights";
  if (scene === 3 || screenId === "judge") return "infoJudge";
  if (scene === 4 || screenId === "wish") return "infoWish";
  return "infoClock";
}

function updateChrome(out) {
  const side = sidpa();
  const day = out[2];
  const phase = phaseText(out[1], out[3]);
  const state = document.getElementById("state");
  state.dataset.day = String(day);
  state.dataset.phase = phase;
  state.dataset.clarity = String(out[4]);
  state.dataset.intensity = String(out[5]);
  state.dataset.complexity = String(out[6]);
  state.dataset.mantra = String(out[8]);
  if (viewMode !== "opening" && !endingLocked) screenId = screenFromScene(side[0]);
  state.dataset.scene = String(side[0]);
  state.dataset.screen = screenId;
  state.dataset.brightest = String(side[3]);
  state.dataset.outcome = String(side[1]);
  state.dataset.methods = String(side[2]);
  state.dataset.paused = rain && rain.isPaused() ? "true" : "false";
  document.getElementById("day").value = String(day);
  document.getElementById("day-read").textContent = t("dayLabel") + " " + day + " " + t("of") + " 49";
  const jung = document.getElementById("dir-jung");
  const book = document.getElementById("dir-book");
  jung.textContent = t("jungShort");
  book.textContent = t("bookShort");
  jung.setAttribute("aria-label", t("directionJung"));
  book.setAttribute("aria-label", t("directionBook"));
  jung.setAttribute("aria-pressed", String(direction === 0));
  book.setAttribute("aria-pressed", String(direction === 1));
  document.getElementById("prev").textContent = t("prev");
  document.getElementById("start").textContent = t("start");
  const autoButton = document.getElementById("auto");
  autoButton.textContent = autoRunning ? t("stop") : t("auto");
  autoButton.setAttribute("aria-pressed", String(autoRunning));
  document.getElementById("next").textContent = t("next");
  document.getElementById("menu").textContent = t("menu");
  document.getElementById("debug").textContent = t("debug");
  const sound = document.getElementById("sound");
  sound.textContent = soundEnabled() ? t("soundOn") : t("soundOff");
  sound.setAttribute("aria-pressed", String(soundEnabled()));
  const teaching = SCENE_CODE[screenId] !== undefined;
  const ending = viewMode === "ending";
  document.body.classList.toggle("is-opening", viewMode === "opening");
  document.body.classList.toggle("is-ending", ending);
  document.body.classList.toggle("has-choice", teaching);
  document.getElementById("enter").textContent = currentInfo(side[0]);
  const quote = document.getElementById("quote");
  if (ending) {
    quote.textContent = t(screenId === "good" ? "quoteGood" : REALM_QUOTE[screenId]);
  }
  const names = sceneCopy(viewMode === "opening" ? -1 : side[0]);
  const moreBody = detailKey
    ? t(detailKey)
    : (viewMode === "opening" ? t("lead") + " " + t("moreEnter") : t(names[1]));
  document.getElementById("more-body").textContent = moreBody;
  document.getElementById("curves").style.display = detailKey ? "none" : "block";
  document.getElementById("outcome").textContent = viewMode === "opening" || ending ? "" : outcomeText(side[1]);
  const list = tourList();
  const index = list.indexOf(screenId);
  document.getElementById("prev").disabled = viewMode === "opening";
  document.getElementById("next").disabled = index === list.length - 1;
  const wantWind = viewMode !== "opening";
  if (wantWind !== windWanted) {
    windWanted = wantWind;
    setWind(wantWind);
  }
}

function paintAxes(ctx, width, height, marker) {
  const left = 36, right = 12, top = 16, bottom = 28;
  const plotW = Math.max(10, width - left - right);
  const plotH = Math.max(10, height - top - bottom);
  ctx.strokeStyle = "#3c4038";
  ctx.fillStyle = "#b7b1a2";
  ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left, top + plotH);
  ctx.lineTo(left + plotW, top + plotH);
  ctx.stroke();
  function line(series, colour) {
    ctx.beginPath();
    ctx.strokeStyle = colour;
    ctx.lineWidth = 1.5;
    for (let d = 0; d <= 49; d++) {
      const x = left + (d / 49) * plotW;
      const y = top + plotH - (series[d] / 1000) * plotH;
      if (d === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  line(curves.clarity, "#d9ffc3");
  line(curves.intensity, "#e0b080");
  line(curves.complexity, "#8aa4c8");
  const x = left + (marker / 49) * plotW;
  ctx.strokeStyle = "#f5e642";
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x, top + plotH);
  ctx.stroke();
}

function drawGraph(day) {
  const canvas = document.getElementById("curves");
  if (!canvas || document.getElementById("more").hidden) return;
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  const width = canvas.clientWidth || 280;
  const height = canvas.clientHeight || 120;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  paintAxes(ctx, width, height, day);
}

function modelNow() {
  const side = sidpa();
  return {
    opening: viewMode === "opening",
    ending: viewMode === "ending",
    screen: screenId,
    scene: side[0],
    methods: side[2],
    bright: side[3],
    x: side[8],
    y: side[9],
    curves: curves
  };
}

function noteFrame(now) {
  frameCount += 1;
  if (frameStamp === 0) frameStamp = now;
  const span = now - frameStamp;
  if (span >= 1000) {
    fps = frameCount * 1000 / span;
    frameCount = 0;
    frameStamp = now;
  }
}

function drawCanvas() {
  paintAll(performance.now(), modelNow());
}

let looping = false;
function ensureLoop() {
  if (looping) return;
  looping = true;
  requestAnimationFrame(function tick(now) {
    if (ada && screenId === "wish" && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      wanderTick = (wanderTick + 1) % 100000;
      compute();
    }
    if (ada) {
      paintAll(now, modelNow());
      noteFrame(now);
    }
    requestAnimationFrame(tick);
  });
}

function placePanels() {
  const stage = window.__stage;
  const choices = document.getElementById("choices");
  const more = document.getElementById("more");
  if (!stage || !choices || !more) return;
  const top = (stage.y + stage.h - 52) + "px";
  const left = stage.x + "px";
  const width = stage.w + "px";
  if (choices.style.top !== top) choices.style.top = top;
  if (choices.style.left !== left) choices.style.left = left;
  if (choices.style.width !== width) choices.style.width = width;
  const panelTop = stage.y + 8;
  const choiceTop = stage.y + stage.h - 56;
  more.style.top = panelTop + "px";
  more.style.left = left;
  more.style.width = width;
  more.style.bottom = "auto";
  more.style.transform = "none";
  more.style.maxHeight = Math.max(72, choiceTop - panelTop - 8) + "px";
}

function render() {
  const out = compute();
  updateChrome(out);
  drawCanvas();
  placePanels();
  ensureLoop();
  drawGraph(out[2]);
}

function sampleCurves() {
  const savedMilli = milli;
  const savedDir = direction;
  for (let day = 0; day <= 49; day++) {
    milli = ada.exports.bardo_milli_of_day(day);
    const out = compute();
    curves.clarity[day] = out[4];
    curves.intensity[day] = out[5];
    curves.complexity[day] = out[6];
  }
  milli = savedMilli;
  direction = savedDir;
  compute();
}

function showScreen(id, button, extra) {
  screenId = id;
  remember(button, extra);
  selectedKey = "";
  lineKey = "";
  detailKey = "";
  arrivalKey = "";
  if (button === "dont") {
    arrivalKey = REALMS.indexOf(id) >= 0 ? pullKey() : (ARRIVE[id] || "");
  }
  document.getElementById("more").hidden = true;
  if (id === "opening") {
    viewMode = "opening";
    endingLocked = false;
    turned = false;
  } else if (ANCHOR[id]) {
    viewMode = "tour";
    endingLocked = false;
    if (id !== "wish") turned = false;
    milli = ada.exports.bardo_milli_of_day(ANCHOR[id]);
  } else {
    viewMode = "ending";
    endingLocked = true;
    turned = false;
  }
  cardsKey = "";
  render();
}

function showOpening() {
  showScreen("opening", "prev");
}

function pullKey() {
  const realm = destination >= 0 && destination <= 5
    ? destination
    : ada.exports.bardo_karma_realm(karma);
  const band = ada.exports.bardo_karma_band(karma);
  return "pull" + band + "_" + realm;
}

function rebirthId() {
  const code = ada.exports.bardo_rebirth(destination, karma);
  return REALMS[code] || "human";
}

function goStart() {
  playClick();
  methodsDone = 0;
  destination = -1;
  poisonSeen = -1;
  wanderTick = 0;
  pendingAction = 0;
  showScreen(firstId(), "start");
}

function goNext() {
  playClick();
  const list = tourList();
  const index = list.indexOf(screenId);
  if (screenId === "opening" || index < 0) {
    showScreen(firstId(), "next");
    return;
  }
  if (index >= list.length - 1) return;
  showScreen(list[index + 1], "next");
}

function goPrev() {
  playClick();
  if (screenId === "opening") return;
  const index = tourList().indexOf(screenId);
  if (index <= 0) {
    showScreen("opening", "prev");
    return;
  }
  showScreen(tourList()[index - 1], "prev");
}

function choose(follow, via) {
  if (via !== "auto") playClick();
  if (!SCENE_CODE[screenId]) return;
  const from = screenId;
  const karmaBefore = karma;
  karma = follow
    ? ada.exports.bardo_karma_lighten(karma)
    : ada.exports.bardo_karma_heavy(karma);
  if (follow && from === "wish") {
    turned = true;
    lineKey = "infoWishTurn";
    detailKey = "bodyWish";
    arrivalKey = "";
    remember("follow", { onward: "chonyid" });
    if (via === "auto") noteStep("follow", from, "wish", { karmaBefore: karmaBefore });
    render();
    return;
  }
  if (follow && from === "womb") {
    const chance = ada.exports.bardo_karma_chance(karma);
    const roll = Math.floor(Math.random() * 1000);
    const natural = roll < chance;
    const ok = via === "auto" ? true : natural;
    if (!ok) {
      lineKey = pullKey();
      detailKey = "detailFail";
      arrivalKey = "";
      render();
      return;
    }
    showScreen("good", "follow");
    if (via === "auto") {
      noteStep("follow", from, "good", {
        karmaBefore: karmaBefore, chance: chance, roll: roll, forced: !natural
      });
    }
    return;
  }
  const next = follow
    ? (from === "lights" ? "judge" : "wish")
    : (from === "wish" ? "judge" : from === "judge" ? "lights" : from === "lights" ? "womb" : rebirthId());
  showScreen(next, follow ? "follow" : "dont");
  if (via === "auto") noteStep(follow ? "follow" : "dont", from, screenId, { karmaBefore: karmaBefore });
}

function explainOf(action, arg) {
  if (action === 1 && arg >= 1 && arg <= 5) {
    return { line: "tapPetal" + arg, detail: "detailPetal" + arg };
  }
  if (action === 2) {
    return arg === 0
      ? { line: "transferA", detail: "detailAmitabha" }
      : { line: "transferT", detail: "detailTusita" };
  }
  if (action === 3 && arg >= 0 && arg <= 3) {
    const names = ["east", "south", "west", "north"];
    return { line: names[arg], detail: "detailSign" + arg };
  }
  if (action === 4 && arg >= 0 && arg <= 5) {
    return { line: "tapLight" + arg, detail: "detailLight" + arg };
  }
  if (action === 5) return { line: "tapMirror", detail: "detailMirror" };
  if (action === 6) return { line: "tapPass", detail: "detailPass" };
  if (action === 7 && arg >= 0 && arg <= 2) {
    return { line: "tapAbyss" + arg, detail: "detailAbyss" + arg };
  }
  if (action === 8) return { line: "tapPebbleW", detail: "detailPebbleW" };
  if (action === 9) return { line: "tapPebbleB", detail: "detailPebbleB" };
  return null;
}

function applyAction(action, arg) {
  pendingAction = action;
  pendingArg = arg;
  compute();
}

function onHit(region, via) {
  const spec = explainOf(region.action, region.arg);
  if (!spec) return;
  const key = region.action + ":" + region.arg;
  const acts = region.action >= 1 && region.action <= 7;
  if (selectedKey === key && acts) {
    const from = screenId;
    const before = methodsDone;
    applyAction(region.action, region.arg);
    if (via !== "auto") playClick();
    if (region.action === 1 && from === "womb" && methodsDone >= 5) {
      showScreen("good", "petals");
      if (via === "auto") noteStep("petals", from, "good");
      return;
    }
    const outcome = sidpa()[1];
    if (outcome === 8) lineKey = "outOrder";
    else if (region.action === 1 && methodsDone > before) lineKey = "tapClosed";
    else if (outcome === 6) lineKey = "outFree";
    else if (outcome === 7) lineKey = "outStay";
    else if (outcome === 4) lineKey = "outAllow";
    else if (outcome === 5) lineKey = "outRefuse";
    else if (outcome === 2) lineKey = "outAmitabha";
    else if (outcome === 3) lineKey = "outTusita";
    else if (outcome === 9) lineKey = region.arg === 0 ? "outAnger" : region.arg === 1 ? "outDesire" : "outIgnorance";
    else if (region.action === 4) lineKey = spec.line;
    else lineKey = spec.line;
    detailKey = spec.detail;
    arrivalKey = "";
    if (via === "auto") noteStep("tap", from, screenId);
    render();
    return;
  }
  selectedKey = key;
  lineKey = spec.line;
  detailKey = spec.detail;
  arrivalKey = "";
  if (via === "auto") noteStep("tap", screenId, screenId);
  render();
}

function noteStep(action, from, led, extra) {
  seenScreens[from] = true;
  seenScreens[led] = true;
  seenLinks[from + ">" + action] = true;
  if (!life) life = { steps: [], karma: karma };
  const step = { screen: from, action: action, led: led, t: Date.now(), karma: karma };
  if (extra) {
    Object.keys(extra).forEach(function (key) { step[key] = extra[key]; });
  }
  life.steps.push(step);
  life.karma = karma;
  if (led === "good" || REALMS.indexOf(led) >= 0) {
    life.ended = led;
    lives.push(life);
    life = { steps: [], karma: karma };
    window.__autoLives = lives.length;
  }
  publishCoverage();
}

const LIFE_SCREENS = ["wish", "judge", "lights", "womb", "good"].concat(REALMS);

function actionsFor(screen) {
  if (screen === "wish") {
    return [
      { id: "follow", kind: "follow" },
      { id: "dont", kind: "dont" },
      { id: "abyss-0", kind: "hit", action: 7, arg: 0 },
      { id: "abyss-1", kind: "hit", action: 7, arg: 1 },
      { id: "abyss-2", kind: "hit", action: 7, arg: 2 }
    ];
  }
  if (screen === "judge") {
    return [
      { id: "follow", kind: "follow" },
      { id: "dont", kind: "dont" },
      { id: "mirror", kind: "hit", action: 5, arg: 0 },
      { id: "pass", kind: "hit", action: 6, arg: 0 },
      { id: "pebble-w", kind: "hit", action: 8, arg: 0 },
      { id: "pebble-b", kind: "hit", action: 9, arg: 0 }
    ];
  }
  if (screen === "lights") {
    const list = [
      { id: "follow", kind: "follow" },
      { id: "dont", kind: "dont" }
    ];
    for (let i = 0; i < 6; i++) list.push({ id: "light-" + i, kind: "light", arg: i });
    return list;
  }
  if (screen === "womb") {
    const list = [
      { id: "follow", kind: "follow" },
      { id: "dont", kind: "dont" }
    ];
    for (let i = 1; i <= 5; i++) list.push({ id: "petal-" + i, kind: "petal", arg: i });
    return list;
  }
  if (screen === "good" || REALMS.indexOf(screen) >= 0) {
    return [{ id: "again", kind: "again" }];
  }
  return [];
}

function requiredLinks() {
  const links = [];
  LIFE_SCREENS.forEach(function (screen) {
    actionsFor(screen).forEach(function (action) {
      links.push({ from: screen, button: action.id });
    });
  });
  links.push({ from: "womb", button: "petals" });
  return links;
}

function unreachedNow() {
  return {
    screens: LIFE_SCREENS.filter(function (id) { return !seenScreens[id]; }),
    links: requiredLinks().filter(function (link) {
      return !seenLinks[link.from + ">" + link.button];
    })
  };
}

function coverageNow() {
  const gaps = unreachedNow();
  const screens = (LIFE_SCREENS.length - gaps.screens.length) + "/" + LIFE_SCREENS.length;
  const linkCount = requiredLinks().length;
  const links = (linkCount - gaps.links.length) + "/" + linkCount;
  return {
    screens: screens,
    links: links,
    complete: gaps.screens.length === 0 && gaps.links.length === 0
  };
}

function publishCoverage() {
  const now = coverageNow();
  window.__coverage = now.screens + " " + now.links;
  window.__coverageComplete = now.complete;
}

function coverageComplete() {
  return coverageNow().complete;
}

function runFile() {
  const totals = { lives: 0, good: 0, incomplete: 0, rebirths: {} };
  REALMS.forEach(function (name) { totals.rebirths[name] = 0; });
  lives.forEach(function (item) {
    if (!item.ended) {
      totals.incomplete += 1;
      return;
    }
    totals.lives += 1;
    if (item.ended === "good") totals.good += 1;
    else if (totals.rebirths[item.ended] !== undefined) totals.rebirths[item.ended] += 1;
  });
  return {
    schema: "bardo-run",
    stamp: STAMP,
    complete: runComplete,
    coverage: coverageNow(),
    lives: lives.map(function (item) {
      return {
        steps: item.steps,
        ended: item.ended || "",
        karma: item.karma,
        incomplete: item.incomplete === true
      };
    }),
    totals: totals,
    unreached: unreachedNow(),
    deadEnds: [{
      from: "wish",
      button: "follow",
      onward: "chonyid",
      note: "Following here would open Chönyid, which is not in this part of the tour."
    }]
  };
}

function downloadRun() {
  const blob = new Blob([JSON.stringify(runFile(), null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "bardo-run.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
}

function finishAuto() {
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = 0;
  if (life && life.steps.length && !life.ended) {
    life.ended = "";
    life.incomplete = true;
    lives.push(life);
  }
  life = null;
  autoRunning = false;
  autoStopRequested = false;
  runComplete = coverageComplete();
  downloadRun();
  render();
}

function scheduleAuto() {
  const pace = window.__autoPace || 3000;
  autoTimer = setTimeout(autoStep, pace);
}

function autoStep() {
  autoTimer = 0;
  if (!autoRunning) return;
  performAutoAction();
  if (autoStopRequested || coverageComplete()) {
    finishAuto();
    return;
  }
  scheduleAuto();
}

function beginAgain(via) {
  if (via !== "auto") playClick();
  const from = screenId;
  const karmaBefore = karma;
  karma = ada.exports.bardo_karma_carry(karma);
  methodsDone = 0;
  destination = -1;
  poisonSeen = -1;
  wanderTick = 0;
  pendingAction = 0;
  showScreen("wish", "again");
  if (via === "auto") noteStep("again", from, "wish", { karmaBefore: karmaBefore });
}

function actionHelps(action) {
  const link = screenId + ">" + action.id;
  if (!seenLinks[link]) return true;
  if (action.kind === "light" && !seenScreens[REALMS[action.arg]]) return true;
  if (action.kind === "petal" && action.arg === methodsDone + 1 && !seenLinks["womb>petals"]) return true;
  if (action.kind === "follow" && screenId === "womb" && !seenScreens.good) return true;
  if (action.kind === "dont" && screenId === "womb") {
    const realm = destination >= 0 && destination <= 5
      ? REALMS[destination]
      : REALMS[ada.exports.bardo_karma_realm(karma)];
    if (!seenScreens[realm]) return true;
  }
  if (action.kind === "dont" && screenId === "wish" && !seenScreens.judge) return true;
  if (action.kind === "dont" && screenId === "judge" && !seenScreens.lights) return true;
  if (action.kind === "dont" && screenId === "lights" && !seenScreens.womb) return true;
  return false;
}

function pickAction() {
  const actions = actionsFor(screenId);
  if (!actions.length) return null;
  let least = actions[0];
  let min = tries[screenId + ">" + least.id] || 0;
  const pool = [];
  actions.forEach(function (action) {
    const count = tries[screenId + ">" + action.id] || 0;
    if (count < min) {
      min = count;
      pool.length = 0;
      pool.push(action);
    } else if (count === min) {
      pool.push(action);
    }
  });
  const helpful = pool.filter(actionHelps);
  const choice = (helpful.length ? helpful : pool);
  return choice[Math.floor(Math.random() * choice.length)];
}

function autoApply(action) {
  const key = screenId + ">" + action.id;
  tries[key] = (tries[key] || 0) + 1;
  if (action.kind === "follow") {
    choose(true, "auto");
    return;
  }
  if (action.kind === "dont") {
    choose(false, "auto");
    return;
  }
  if (action.kind === "again") {
    beginAgain("auto");
    return;
  }
  const from = screenId;
  const karmaBefore = karma;
  if (action.kind === "light") {
    destination = action.arg;
    applyAction(4, action.arg);
    lineKey = "tapLight" + action.arg;
    detailKey = "detailLight" + action.arg;
    arrivalKey = "";
    noteStep(action.id, from, screenId, { karmaBefore: karmaBefore });
    render();
    return;
  }
  if (action.kind === "petal") {
    const before = methodsDone;
    applyAction(1, action.arg);
    if (from === "womb" && methodsDone >= 5) {
      showScreen("good", "petals");
      noteStep(action.id, from, "womb", { karmaBefore: karmaBefore });
      noteStep("petals", from, "good", { karmaBefore: karmaBefore });
      return;
    }
    lineKey = methodsDone > before ? "tapClosed" : (sidpa()[1] === 8 ? "outOrder" : "tapPetal" + action.arg);
    detailKey = "detailPetal" + action.arg;
    arrivalKey = "";
    noteStep(action.id, from, screenId, { karmaBefore: karmaBefore });
    render();
    return;
  }
  if (action.action >= 1 && action.action <= 7) applyAction(action.action, action.arg);
  const spec = explainOf(action.action, action.arg);
  if (spec) {
    lineKey = spec.line;
    detailKey = spec.detail;
    arrivalKey = "";
  }
  noteStep(action.id, from, screenId, { karmaBefore: karmaBefore });
  render();
}

function performAutoAction() {
  if (!actionsFor(screenId).length) {
    const from = screenId;
    showScreen("wish", "auto");
    noteStep("start", from, screenId, { karmaBefore: karma });
    return;
  }
  const action = pickAction();
  if (!action) return;
  autoApply(action);
}

function startAuto() {
  if (autoRunning) return;
  autoRunning = true;
  autoStopRequested = false;
  runComplete = false;
  lives = [];
  life = { steps: [], karma: karma };
  seenScreens = {};
  seenLinks = {};
  tries = {};
  window.__autoLives = 0;
  if (screenId === "opening" || screenId === "clock") showScreen("wish", "auto");
  seenScreens[screenId] = true;
  publishCoverage();
  scheduleAuto();
  render();
}

function requestStop() {
  if (!autoRunning) return;
  autoStopRequested = true;
  if (!autoTimer) finishAuto();
}

function loadGlyphs() {
  const sequences = { 1: [], 2: [], 3: [] };
  for (let mantra = 1; mantra <= 3; mantra++) {
    for (let index = 0; index < 32; index++) {
      ada.exports.bardo_mantra_glyph(mantra, index);
      const out = output();
      if (out[0] === 4) break;
      if (out[0] !== 0) throw new Error("glyph status " + out[0]);
      const bytes = new Uint8Array(ada.exports.memory.buffer, ada.glyphPtr, out[12]);
      const text = new TextDecoder("utf-8").decode(bytes);
      if (text === "\u094D" || text.endsWith("\u094D")) throw new Error("virama cluster");
      sequences[mantra].push(text);
    }
  }
  return sequences;
}

function report() {
  const state = document.getElementById("state");
  return {
    schema: "bardo-d009",
    stamp: STAMP,
    settings: {
      language: "en-GB",
      direction: direction === 0 ? "jung-reverse" : "book-order",
      day: Number(state.dataset.day),
      phase: state.dataset.phase,
      scene: Number(state.dataset.scene),
      sound: soundEnabled(),
      rainPaused: rain ? rain.isPaused() : true,
      reducedMotion: rain ? rain.prefersReduced() : matchMedia("(prefers-reduced-motion: reduce)").matches
    },
    screen: screenId,
    viewport: { width: window.innerWidth, height: window.innerHeight },
    devicePixelRatio: window.devicePixelRatio || 1,
    userAgent: navigator.userAgent,
    path: pathLog.slice(),
    fps: Math.round(fps * 10) / 10,
    errors: errors.slice(),
    crash: { afterReload: crashNotice !== "", notice: crashNotice },
    note: document.getElementById("note").value
  };
}

function downloadReport() {
  const blob = new Blob([JSON.stringify(report(), null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "bardo-report.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
}

function readCString(ptr) {
  const mem = new Uint8Array(ada.exports.memory.buffer);
  let end = ptr;
  const limit = Math.min(mem.length, ptr + 180);
  while (end < limit && mem[end] !== 0) end++;
  return new TextDecoder().decode(mem.subarray(ptr, end));
}

async function boot() {
  document.getElementById("stamp").textContent = STAMP;
  try {
    crashNotice = sessionStorage.getItem("bardo-crash") || "";
    if (crashNotice) sessionStorage.removeItem("bardo-crash");
  } catch (err) {
    crashNotice = "";
  }
  if (crashNotice) {
    const banner = document.getElementById("crash");
    banner.hidden = false;
    banner.textContent = t("crash").replace("{notice}", crashNotice);
  }
  const bytes = Uint8Array.from(atob(WASM_BASE64), function (c) { return c.charCodeAt(0); });
  const env = new Proxy({
    bardo_host_trap: function (ptr, line) {
      const notice = readCString(ptr >>> 0) + ":" + line;
      try { sessionStorage.setItem("bardo-crash", notice); } catch (err) { /* private mode */ }
      showError(notice);
      throw new Error(notice);
    }
  }, {
    get: function (target, prop) {
      if (prop in target) return target[prop];
      if (typeof prop !== "string") return undefined;
      showError("unknown wasm import " + prop);
      return function () { return 0; };
    }
  });
  const instantiated = await WebAssembly.instantiate(bytes, { env: env });
  const exports = instantiated.instance.exports;
  if (typeof exports.adainit === "function") exports.adainit();
  ada = {
    exports: exports,
    inPtr: exports.bardo_input() >>> 0,
    outPtr: exports.bardo_output() >>> 0,
    sidpaPtr: exports.bardo_sidpa() >>> 0,
    glyphPtr: exports.bardo_glyph() >>> 0
  };
  const sequences = loadGlyphs();
  direction = 0;
  destination = -1;
  karma = exports.bardo_karma_start();
  milli = exports.bardo_start(direction);
  sampleCurves();
  applyStaticText();
  rain = startRain({
    canvas: document.getElementById("rain"),
    button: document.getElementById("rain-toggle"),
    sequences: sequences,
    labels: function () { return { pause: t("pause"), play: t("play") }; },
    scales: function () {
      const out = output();
      return { speed: out[9], alpha: out[10], stride: out[11] || 1 };
    }
  });
  remember("load");
  render();
  window.__bardoReady = true;
}

function setDirection(next) {
  direction = next;
  milli = ada.exports.bardo_start(direction);
  methodsDone = 0;
  destination = -1;
  poisonSeen = -1;
  endingLocked = false;
  turned = false;
  lineKey = "";
  detailKey = "";
  arrivalKey = "";
  selectedKey = "";
  cardsKey = "";
  if (viewMode !== "opening") viewMode = "tour";
  render();
}

function pollVersion() {
  if (location.protocol === "file:") return;
  fetch(RAW_VERSION, { cache: "no-store" })
    .then(function (res) { return res.ok ? res.text() : ""; })
    .then(function (text) {
      const remote = text.trim();
      if (!remote || remote === STAMP) return;
      const button = document.getElementById("reload");
      button.hidden = false;
      button.textContent = t("reload").replace("{stamp}", remote);
      button.onclick = function () {
        fetch(REPO_API, { cache: "no-store" })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && /^[0-9a-f]{40}$/.test(data.sha)) {
              location.assign("https://rawcdn.githack.com/RobertBoettcherSF/bardo-visualization/" + data.sha + "/index.html");
            } else {
              location.reload();
            }
          })
          .catch(function () { location.reload(); });
      };
    })
    .catch(function () { /* a failed poll is not a new build */ });
}

document.getElementById("dir-jung").addEventListener("click", function () { setDirection(0); playClick(); });
document.getElementById("dir-book").addEventListener("click", function () { setDirection(1); playClick(); });
document.getElementById("day").addEventListener("input", function (event) {
  endingLocked = false;
  turned = false;
  lineKey = "";
  detailKey = "";
  arrivalKey = "";
  selectedKey = "";
  milli = ada.exports.bardo_milli_of_day(Number(event.target.value));
  if (viewMode === "opening") viewMode = "tour";
  cardsKey = "";
  render();
});
document.getElementById("go").addEventListener("click", function () {
  if (viewMode === "opening") showScreen(firstId(), "enter");
});
document.getElementById("follow").addEventListener("click", function () { choose(true); });
document.getElementById("dont").addEventListener("click", function () { choose(false); });
document.getElementById("again").addEventListener("click", function () { beginAgain(); });
document.getElementById("auto").addEventListener("click", function () {
  if (autoRunning) requestStop();
  else startAuto();
});
document.getElementById("enter").addEventListener("click", function () {
  const more = document.getElementById("more");
  more.hidden = !more.hidden;
  if (!more.hidden) {
    placePanels();
    drawGraph(Number(document.getElementById("state").dataset.day || "0"));
  }
});
document.getElementById("menu").addEventListener("click", function () {
  const panel = document.getElementById("menu-panel");
  panel.hidden = !panel.hidden;
  document.getElementById("menu").setAttribute("aria-expanded", String(!panel.hidden));
});
document.getElementById("next").addEventListener("click", goNext);
document.getElementById("prev").addEventListener("click", goPrev);
document.getElementById("start").addEventListener("click", goStart);
document.getElementById("sound").addEventListener("click", function () {
  setSound(!soundEnabled());
  if (soundEnabled()) playClick();
  render();
});
document.getElementById("debug").addEventListener("click", downloadReport);
document.addEventListener("keydown", function (event) {
  if (event.key === "F9" && event.target.id !== "note") {
    event.preventDefault();
    downloadReport();
    return;
  }
  if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") return;
  if (event.key === "ArrowRight") { event.preventDefault(); goNext(); }
  if (event.key === "ArrowLeft") { event.preventDefault(); goPrev(); }
  if (event.key === "Home") {
    event.preventDefault();
    document.getElementById("start").click();
  }
});
const viz = document.getElementById("viz");
let pointer = null;
viz.addEventListener("pointerdown", function (event) {
  pointer = { x: event.clientX, y: event.clientY };
});
viz.addEventListener("pointerup", function (event) {
  if (!pointer) return;
  const dx = event.clientX - pointer.x;
  const dy = event.clientY - pointer.y;
  pointer = null;
  if (Math.hypot(dx, dy) > 36) {
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 48) {
      if (dx < 0) goNext();
      else goPrev();
    }
    return;
  }
  if (viewMode !== "tour") return;
  const rect = viz.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  for (let i = regions.length - 1; i >= 0; i--) {
    if (hitContains(regions[i], x, y)) {
      onHit(regions[i]);
      return;
    }
  }
});
addEventListener("resize", function () {
  if (!ada) return;
  drawCanvas();
  placePanels();
  drawGraph(Number(document.getElementById("state").dataset.day || "0"));
});

boot().catch(function (err) {
  showError(t("errorWasm") + " " + (err && err.message ? err.message : String(err)));
  window.__bardoReady = false;
  window.__bardoError = String(err);
});
pollVersion();
setInterval(pollVersion, 120000);

</script>
