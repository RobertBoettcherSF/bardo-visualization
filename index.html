@font-face {

}
* { box-sizing: border-box; }
html, body { margin: 0; background: #070807; color: #e7e2d4; }
body { min-height: 100dvh; font: 18px/1.45 Georgia, "Iowan Old Style", Palatino, serif; }
button, input { font-size: 16px; font-family: ui-sans-serif, system-ui, sans-serif; }
button { min-height: 44px; min-width: 44px; }
#rain {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;

}
#viz { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; touch-action: none; }
.stamp {
  position: fixed; z-index: 8;

  right: calc(env(safe-area-inset-right) + 8px);
  margin: 0; max-width: calc(100vw - 68px);
  background: #f5e642; color: #111;
  font: 700 11px/1.2 ui-sans-serif, system-ui, sans-serif;
  padding: 4px 6px; pointer-events: none; white-space: nowrap;
}
.sid {
  position: fixed; z-index: 8;
  top: calc(env(safe-area-inset-top) + 54px);
  left: max(8px, env(safe-area-inset-left));
  margin: 0;
  color: #c8c2b4;
  font: 600 11px/1.2 ui-sans-serif, system-ui, sans-serif;
  pointer-events: none;
}
#menu {
  position: fixed; z-index: 8;
  top: calc(env(safe-area-inset-top) + 6px);
  left: max(6px, env(safe-area-inset-left));
  width: 44px; padding: 0;
}
#menu-panel {
  position: fixed; z-index: 8;
  top: calc(env(safe-area-inset-top) + 56px);
  left: max(6px, env(safe-area-inset-left));

  padding: 8px;
  font-family: ui-sans-serif, system-ui, sans-serif;
}
#menu-panel[hidden], #more[hidden], #reload[hidden], #crash[hidden], #errors[hidden] { display: none; }
#menu-panel .row { display: flex; gap: 6px; margin: 6px 0; }
#menu-panel .row button { flex: 1; }
button { background: #1a1e1a; color: #e7e2d4; border: 1px solid #3c4038; padding: 0 10px; }
button[aria-pressed="true"] { background: #e7e2d4; color: #111; }
.debug { background: #c62828; color: #fff; border-color: #c62828; font-weight: 700; }
#day, #note { width: 100%; min-height: 44px; }
#reload {
  position: fixed; z-index: 7;

}

  position: fixed; z-index: 7; left: 8px; right: 8px;

}
#caption {
  position: fixed; z-index: 4;

  text-align: center;
  pointer-events: none;
}
#caption h1, #caption button { pointer-events: auto; }
.info {
  position: static; transform: none;
  width: min(34rem, calc(100vw - 1.5rem));
  margin: 0 auto; padding: 0 12px;
  text-align: center;
  background: transparent; border: 0; color: #f7f4ea;

  user-select: none; -webkit-user-select: none;

#coda { display: none; margin-top: 6px; }
body.is-ending #coda { display: inline-block; }
.quote {
  width: min(36rem, calc(100vw - 1.5rem));
  margin: 4px auto 0; padding: 0 12px;
  text-align: center; color: #f7f4ea;
  font: italic 0.95rem/1.35 Georgia, "Iowan Old Style", Palatino, serif;
  text-shadow: 0 1px 6px #000;

  position: fixed; z-index: 6;

#choices button {

}
#dissolve[hidden] { display: none; }
#dissolve-label, #dissolve-read {
  margin: 0; text-align: center; color: #f7f4ea;

#dissolve-range { width: 100%; accent-color: #e0c36a; }
#dissolve-read { display: none; }
#more {
  position: fixed; z-index: 5;
  overflow: auto;
  background: rgba(7, 8, 7, 0.92);
  padding: 0.7rem 0.9rem; text-align: center;
  user-select: none; -webkit-user-select: none;
}
#curves { width: 100%; height: 120px; background: #0c0e0c; }
.bar {
  position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  display: flex; gap: 6px;
  padding:
    6px
    max(8px, env(safe-area-inset-right))

}
.bar button { flex: 1; }
#auto-cover {

  bottom: calc(env(safe-area-inset-bottom) + 3.6rem);

#auto-cover[hidden], #auto-ask[hidden], #auto-run[hidden] { display: none; }
.auto-panel {

  padding: 1.2rem 1.3rem; text-align: center;

.auto-panel h2 {

// Evolved from interactive-formulas rain.js (v0.11).
// Pitch 14, glyph 13, gap 14, head #d9ffc3, trail #83c79d.
// frameMs is the motion timebase (how far a column used to move per 60 ms
// tick), not a frame cap. Columns spell whole grapheme clusters.
// Each mantra is drawn once into a strip and blitted, so a wide window
// does not call fillText for every glyph on every frame.
const RAIN = {
  columnPitch: 14,
  fontSize: 13,
  glyphGap: 14,
  minTrail: 36,
  head: "#d9ffc3",
  body: "#83c79d",
  frameMs: 60
};

function startRain(opts) {
  const canvas = opts.canvas;
  const button = opts.button;
  const ctx = canvas.getContext("2d");
  const media = matchMedia("(prefers-reduced-motion: reduce)");
  let paused = media.matches;
  let width = 0;
  let height = 0;
  let columns = [];
  let last = 0;
  let strips = {};
  let rainDpr = 1;

  function trailLength(h) {
    return Math.max(RAIN.minTrail, Math.ceil(h / RAIN.glyphGap));
  }

  function fillGlyphs(mantra, trail) {
    const seq = opts.sequences[mantra];
    const glyphs = new Array(trail);
    for (let i = 0; i < trail; i++) {
      const fromTop = trail - 1 - i;
      glyphs[i] = seq[fromTop % seq.length];
    }
    return glyphs;
  }

  function strip(mantra, trail, alphaScale) {
    const key = mantra + ":" + trail + ":" + alphaScale + ":" + rainDpr;
    if (strips[key]) return strips[key];
    const glyphs = fillGlyphs(mantra, trail);
    const w = RAIN.columnPitch;
    const h = trail * RAIN.glyphGap + RAIN.fontSize;
    const image = document.createElement("canvas");
    image.width = Math.max(1, Math.round(w * rainDpr));
    image.height = Math.max(1, Math.round(h * rainDpr));
    const pen = image.getContext("2d");
    pen.setTransform(rainDpr, 0, 0, rainDpr, 0, 0);
    pen.font = RAIN.fontSize + 'px "Rain Devanagari", serif';
    pen.textAlign = "center";
    for (let i = 0; i < glyphs.length; i++) {
      const base = Math.max(0.08, (1 - i / (glyphs.length + 1)) * 0.85);
      pen.globalAlpha = Math.min(1, base * alphaScale);
      pen.fillStyle = i === 0 ? RAIN.head : RAIN.body;
      pen.fillText(glyphs[i], w / 2, trail * RAIN.glyphGap - i * RAIN.glyphGap);
    }
    strips[key] = image;
    return image;
  }

  function makeColumns() {
    const count = Math.max(0, Math.ceil(width / RAIN.columnPitch));
    const trail = trailLength(height);
    columns = [];
    for (let i = 0; i < count; i++) {
      const mantra = (i % 3) + 1;
      columns.push({
        x: i * RAIN.columnPitch + RAIN.columnPitch / 2,
        y: Math.random() * (height + trail * RAIN.glyphGap) - trail * RAIN.glyphGap,
        speed: 0.7 + Math.random() * 1.6,
        mantra: mantra
      });
    }
  }

  function resize() {
    width = innerWidth;
    height = innerHeight;
    rainDpr = 1;
    strips = {};
    canvas.width = Math.round(width * rainDpr);
    canvas.height = Math.round(height * rainDpr);
    ctx.setTransform(rainDpr, 0, 0, rainDpr, 0, 0);
    makeColumns();
    draw(RAIN.frameMs);
  }

  function draw(dt) {
    const scale = opts.scales();
    const speedScale = scale.speed / 1000;
    const alphaScale = scale.alpha / 1000;
    const stride = scale.stride || 1;
    const step = dt / RAIN.frameMs;
    ctx.clearRect(0, 0, width, height);
    const trail = trailLength(height);
    const stripH = trail * RAIN.glyphGap + RAIN.fontSize;
    for (let c = 0; c < columns.length; c++) {
      const column = columns[c];
      column.y += column.speed * 3.2 * speedScale * step;
      if (column.y - trail * RAIN.glyphGap > height) {
        column.y = -RAIN.glyphGap;
        column.mantra = (column.mantra % 3) + 1;
      }
      if (c % stride !== 0) continue;
      const image = strip(column.mantra, trail, alphaScale);
      ctx.drawImage(
        image,
        column.x - RAIN.columnPitch / 2,
        column.y - trail * RAIN.glyphGap,
        RAIN.columnPitch,
        stripH
      );
    }
  }

  function refreshLabels() {
    const labels = opts.labels();
    button.textContent = paused ? labels.play : labels.pause;
    button.setAttribute("aria-pressed", String(paused));
  }

  function frame(time) {
    if (window.__autoCover) {
      requestAnimationFrame(frame);
      return;
    }
    if (!paused && !document.hidden) {
      const dt = last === 0 ? RAIN.frameMs : Math.min(48, time - last);
      last = time;
      draw(dt);
    }
    requestAnimationFrame(frame);
  }

  button.addEventListener("click", function () {
    paused = !paused;
    refreshLabels();
  });
  media.addEventListener("change", function (event) {
    paused = event.matches;
    refreshLabels();
  });
  addEventListener("resize", resize);
  resize();
  document.fonts.load(RAIN.fontSize + 'px "Rain Devanagari"').then(function () {
    strips = {};
    draw(0);
  });
  refreshLabels();
  requestAnimationFrame(frame);

  return {
    refreshLabels: refreshLabels,
    isPaused: function () { return paused; },
    prefersReduced: function () { return media.matches; }
  };
}

// Browser-only Sidpa wind and clicks. No audio files.
// The context is created on the Sound tap, never before.
let audio = null;
let windGain = null;
let soundOn = false;
const reducedSound = matchMedia("(prefers-reduced-motion: reduce)");

function soundEnabled() {
  return soundOn;
}

function ensureAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audio = new Ctx();
  const rate = audio.sampleRate;
  const buffer = audio.createBuffer(1, rate * 2, rate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const source = audio.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  const filter = audio.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 240;
  windGain = audio.createGain();
  windGain.gain.value = 0;
  source.connect(filter);
  filter.connect(windGain);
  windGain.connect(audio.destination);
  source.start();
}

function setWind(active) {
  if (!windGain || !audio) return;
  const level = soundOn && active && !reducedSound.matches ? 0.028 : 0;
  windGain.gain.setTargetAtTime(level, audio.currentTime, 0.15);
}

function setSound(on) {
  soundOn = on;
  if (on) {
    ensureAudio();
    audio.resume();
  }
  setWind(false);
}

function playClick() {
  if (!soundOn || !audio || reducedSound.matches) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = "sine";
  osc.frequency.value = 440;
  gain.gain.setValueAtTime(0.035, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + 0.06);
}

reducedSound.addEventListener("change", function () {
  if (reducedSound.matches) setWind(false);
});

// Reads data/iconography.json and turns each Chonyid day into paint specs.
// Visible sentences are stored in STRINGS.en so a later overlay can replace them.
const WORD_HEX = {
  white: "#E6E0D4",
  "brilliant white": "#F4F1E6",
  red: "#8E3A3A",
  "dark red": "#6B2428",
  "darkish red": "#6B2428",
  "reddish black": "#3A1518",
  "reddish-black": "#3A1518",
  yellow: "#C4A24A",
  "dark yellow": "#A8842A",
  "darkish yellow": "#A8842A",
  golden: "#C4A24A",
  "golden-orange": "#C47A3A",
  "golden orange": "#C47A3A",
  green: "#3A6B48",
  "dark green": "#1A3328",
  blue: "#2C4A6E",
  "dark blue": "#1A2A44",
  "dark-blue": "#1A2A44",
  "deep blue": "#1B3354",
  "dark brown": "#4A3228",
  "dark-brown": "#4A3228",
  maroon: "#6B2428",
  black: "#1C1C1C",
  smoky: "#5C5550",
  grey: "#6E6A64",
  "ash-grey": "#6E6A64",
  "dull white": "#C9C3B5",
  "dull blue": "#3A4A62",
  "dull yellow": "#A89A55",
  "dull bluish-yellow": "#8F9A5C",
  "bluish-yellow": "#8F9A5C",
  "dull green": "#4A5E48",
  "dull red": "#7A4548",
  "dull reddish": "#7A4548",
  "five-coloured": "#C4A24A"
};

const UNSTATED = "#8A8478";
const MAROON = "#6B2428";
const JUNG_NOTE = "Jung lists the peaceful days in reverse, from day 7 back toward day 1. This tour follows that order. Colours follow the root text.";

function hexFromWords(text) {
  const raw = String(text || "").toLowerCase();
  const keys = Object.keys(WORD_HEX).sort(function (a, b) { return b.length - a.length; });
  for (let i = 0; i < keys.length; i++) {
    if (raw.indexOf(keys[i]) >= 0) return WORD_HEX[keys[i]];
  }
  return "";
}

function englishOnly(text) {
  return String(text || "")
    .replace(/\s*\(([^)]*)\)/g, function (_, inner) {
      if (/[^\x00-\x7F]/.test(inner)) return "";
      if (/\b(the|a|an|of|in|and|not|with|from|this|day|holding)\b/i.test(inner)) return " (" + inner + ")";
      return "";
    })
    .replace(/\s+/g, " ")
    .replace(/\s+([,.;])/g, "$1")
    .trim();
}

function putString(key, text) {
  STRINGS.en[key] = text;
}

function deityColour(deity) {
  if (deity.body_colour_hex && deity.body_colour_hex.value) return deity.body_colour_hex.value;
  const outside = deity.outside_source && deity.outside_source.body_colour;
  if (outside) {
    const hex = hexFromWords(outside);
    if (hex) return hex;
  }
  if (deity.body_colour_source) {
    const hex = hexFromWords(deity.body_colour_source);
    if (hex) return hex;
  }
  return UNSTATED;
}

function uncertainOf(deity) {
  const bits = [];
  const outside = deity.outside_source && (deity.outside_source.body_colour || deity.outside_source.consort_colour);
  if (!deity.body_colour_source && outside) {
    bits.push("the source does not state the body colour; the paint follows the checked table’s outside note (" + englishOnly(outside) + ")");
  } else if (!deity.body_colour_source && !deity._carried) {
    bits.push("the source does not state the body colour");
  }
  if (deity.faces > 1 && !deity.face_colours) bits.push("the face colours are not given");
  return bits.join(". ");
}

function familyWord(name) {
  const n = String(name || "").toLowerCase();
  if (n.indexOf("vairocana") >= 0) return "white";
  if (n.indexOf("vajrasattva") >= 0 || n.indexOf("akshobhya") >= 0) return "blue";
  if (n.indexOf("ratnasambhava") >= 0) return "yellow";
  if (n.indexOf("amit") >= 0) return "red";
  if (n.indexOf("amoghasiddhi") >= 0) return "green";
  return "";
}

function expandDeities(entry) {
  const out = [];
  (entry.deities || []).forEach(function (deity) {
    if (!deity.name_en) return;
    if (deity.role === "main_couple") {
      const buddha = deity.name_en.split(",")[0];
      const word = familyWord(buddha);
      out.push(Object.assign({}, deity, {
        name_en: buddha,
        body_colour_source: word,
        body_colour_hex: null,
        _carried: true,
        note: "Attributes are not itemised again on this day. The colour is the one the root text gives this Buddha on the earlier day. " + (deity.note || "")
      }));
      const cons = deity.outside_source || {};
      out.push({
        role: "consort",
        name_en: cons.consort_sanskrit || (buddha + ", consort"),
        outside_source: cons.consort_colour ? { body_colour: cons.consort_colour } : null,
        note: "Her colour is not stated on this day.",
        items: []
      });
      return;
    }
    out.push(deity);
  });
  return out;
}

function figureOf(deity, book, index) {
  const items = (deity.items || []).map(function (item) { return englishOnly(item.item_en); }).filter(Boolean);
  const five = /five colour|five-colour|all five/i.test(deity.body_colour_source || "");
  const unsure = uncertainOf(deity);
  const mount = deity.mount_or_throne && deity.mount_or_throne.en ? englishOnly(deity.mount_or_throne.en) : "";
  const parts = [englishOnly(deity.name_en || "A figure")];
  if (deity._carried && deity.body_colour_source) parts.push(deity.body_colour_source + ", carried from the earlier day");
  else if (deity.body_colour_source) parts.push(englishOnly(deity.body_colour_source));
  if (items.length) parts.push("Emblem: " + items.join(", "));
  if (mount) parts.push(mount);
  if (deity.note) parts.push(englishOnly(deity.note));
  if (unsure) parts.push("Uncertain: " + unsure);
  parts.push(JUNG_NOTE);
  const line = "p" + book + "f" + index;
  const detail = line + "d";
  putString(line, englishOnly(deity.name_en || "Figure"));
  putString(detail, parts.join(". ").replace(/\.\.+/g, "."));
  return {
    name: deity.name_en || "Figure",
    colour: five ? "#C4A24A" : deityColour(deity),
    rainbow: five,
    line: line,
    detail: detail,
    items: items,
    mount: mount,
    role: deity.role || ""
  };
}

function lightOf(entry, book, index) {
  const src = englishOnly(entry.colour_source || "");
  const withheld = entry.kind === "wisdom_withheld" || /does not appear|withheld/i.test(entry.colour_source || "") || /withheld/i.test(entry.name_en || "");
  const dull = entry.kind === "dull_realm" || (!entry.name_en && !!entry.realm_en);
  let name = englishOnly(entry.name_en || "");
  if (!name && entry.realm_en) name = src + ", " + englishOnly(entry.realm_en);
  if (!name) name = src || "Light";
  const parts = [name];
  if (src && parts[0].indexOf(src) < 0) parts.push(src);
  if (entry.from) parts.push("From " + englishOnly(entry.from));
  if (entry.note) {
    englishOnly(entry.note).split(/(?<=\.)\s+/).forEach(function (sentence) {
      if (/^Proposed link/i.test(sentence)) return;
      if (sentence) parts.push(sentence);
    });
  }
  if (/does not use the word hell|does not say hell|day 2 does not/i.test(entry.note || "")) {
    parts.push("Uncertain as a name: this day does not say hell");
  }
  if (/bluish/.test(entry.colour_source || "") && /dull yellow/i.test(entry.note || "")) {
    parts.push("Uncertain: this day says bluish-yellow; a later day says dull yellow");
  }
  parts.push(JUNG_NOTE);
  const line = "p" + book + "l" + index;
  const detail = line + "d";
  putString(line, name);
  putString(detail, parts.join(". ").replace(/\.\.+/g, "."));
  const rainbow = /five-colour|five colour/i.test(entry.colour_source || "");
  const hex = entry.colour_hex && entry.colour_hex.value;
  return {
    name: name,
    colour: hex || hexFromWords(entry.colour_source) || "#C4A24A",
    rainbow: rainbow,
    withheld: withheld,
    dull: dull,
    line: line,
    detail: detail
  };
}

function peaceSpec(entry) {
  const book = entry.chonyid_day;
  const deities = expandDeities(entry);
  const figures = deities.map(function (deity, index) { return figureOf(deity, book, index); });
  const lights = (entry.lights || []).map(function (light, index) { return lightOf(light, book, index); });
  const emblems = [];
  figures.forEach(function (fig, index) {
    fig.items.forEach(function (item) {
      const n = emblems.length;
      const line = "p" + book + "e" + n;
      const detail = line + "d";
      putString(line, item);
      putString(detail, fig.name + " — " + item + ". " + JUNG_NOTE);
      emblems.push({ name: item, colour: "#E0C36A", line: line, detail: detail, owner: index });
    });
    if (fig.mount) {
      const n = emblems.length;
      const line = "p" + book + "e" + n;
      const detail = line + "d";
      putString(line, fig.mount);
      putString(detail, fig.name + " — " + fig.mount + ". " + JUNG_NOTE);
      emblems.push({ name: fig.mount, colour: "#C4A24A", line: line, detail: detail, owner: index });
    }
  });
  const jung = 19 - book;
  const layout = book === 6 ? "grid" : book === 7 ? "mandala" : "seat";
  let blurb = englishOnly(entry.title_en || "").replace(/^Step \d+ — /, "");
  if (entry.direction && String(entry.direction).length < 40) blurb += " (" + entry.direction + ")";
  if (lights.some(function (light) { return light.withheld; })) {
    blurb += ". The green all-accomplishing path is withheld.";
  }
  const blurbKey = "p" + book + "blurb";
  putString(blurbKey, blurb);
  return {
    id: "p" + book,
    code: "J" + (jung < 10 ? "0" : "") + jung + "-B0" + book,
    cal: entry.calendar_day,
    book: book,
    peace: true,
    blurb: blurbKey,
    layout: layout,
    figures: figures,
    lights: lights,
    emblems: emblems
  };
}

function applyWrathful(table) {
  const byDay = { 8: "w08", 9: "w09", 10: "w10", 11: "w11", 12: "w12", 13: "w13", 14: "w14" };
  (table.entries || []).forEach(function (entry) {
    const id = byDay[entry.chonyid_day];
    if (!id || !SCREEN[id]) return;
    const deities = entry.deities || [];
    if (entry.chonyid_day >= 13) {
      const picked = entry.chonyid_day === 14
        ? deities.filter(function (d) { return d.role === "female_door_keeper"; })
        : [deities[0]].concat(deities.filter(function (d) { return d.role === "htamenma"; }).slice(0, 4));
      picked.forEach(function (deity, index) {
        const fig = SCREEN[id].figures[index];
        if (!fig || !deity) return;
        fig.colour = deityColour(deity);
      });
      return;
    }
    const heruka = deities.filter(function (d) { return d.role === "heruka"; })[0];
    const consort = deities.filter(function (d) { return d.role === "consort"; })[0];
    if (!heruka) return;
    let body = deityColour(heruka);
    const faces = heruka.face_colours || {};
    if (entry.chonyid_day === 8) body = MAROON;
    SCREEN[id].body = body;
    SCREEN[id].faces = [
      hexFromWords(faces.right || "white") || "#E6E0D4",
      entry.chonyid_day === 8 ? body : (hexFromWords(faces.middle || heruka.body_colour_source) || body),
      hexFromWords(faces.left || "red") || "#8E3A3A"
    ];
    const fig = SCREEN[id].figures && SCREEN[id].figures[0];
    if (entry.chonyid_day === 8 && fig) {
      putString("tapBuddhaH", "Buddha Heruka, painted maroon, three faces, six hands.");
      putString("detailBuddhaH", "Book day 8. The root text calls the Great Glorious Buddha Heruka dark brown, right face white, left face red, centre dark brown, and says he is Vairochana. The checked table records the Dudjom card’s central figure as maroon-red. This screen is painted maroon. Uncertain against the root text: the book says dark brown.");
    } else if (fig && !heruka.face_colours) {
      const key = fig.detail;
      const text = STRINGS.en[key] || "";
      if (!/face colour/i.test(text)) {
        putString(key, text + " Uncertain: the three face colours are not given for this day.");
      }
    }
    if (consort && SCREEN[id].figures[1] && !consort.body_colour_source) {
      const key = SCREEN[id].figures[1].detail;
      const text = STRINGS.en[key] || "";
      if (!/body colour/i.test(text)) {
        putString(key, text + " Uncertain: her body colour is not stated.");
      }
    }
  });
}

async function loadIconography() {
  if (window.__iconsReady) return;
  const response = await fetch("data/iconography.json", { cache: "no-store" });
  if (!response.ok) throw new Error("iconography " + response.status);
  const table = await response.json();
  applyWrathful(table);
  [7, 6, 5, 4, 3, 2, 1].forEach(function (day) {
    const entry = (table.entries || []).filter(function (item) {
      return item.kind === "chonyid_day" && item.chonyid_day === day && item.phase === "peaceful";
    })[0];
    if (!entry) throw new Error("missing peaceful day " + day);
    const spec = peaceSpec(entry);
    if (spec.figures.length < 1) throw new Error("empty peaceful day " + day);
    SCREEN[spec.id] = spec;
    if (CLIMB.indexOf(spec.id) < 0) CLIMB.push(spec.id);
  });
  if (SCREEN.p6 && SCREEN.p6.figures.length !== 42) {
    throw new Error("day 6 figures " + SCREEN.p6.figures.length);
  }
  ["c19", "c20"].forEach(function (id) {
    if (CLIMB.indexOf(id) < 0) CLIMB.push(id);
  });
  window.__iconsReady = true;
  window.__screenCodes = CLIMB.map(function (id) { return SCREEN[id].code; });
}

// Painted scenes. Everything is drawn in code inside a centred 3:4 stage
// so a wide window letterboxes instead of stretching strokes to the edges.
let regions = [];
let originX = 0;
let originY = 0;
let bg = null;
let bgKey = "";
let regionKey = "";

const REALM_WASH = {
  deva: "#c9c3b5",
  asura: "#4a5e48",
  human: "#a89a55",
  animal: "#3a4a62",
  preta: "#7a4548",
  hell: "#5c5550"
};

function stageBox(width, height, opening, ending) {
  const bar = 72;
  const caption = opening ? 108 : ending ? 168 : 56;
  const top = 40;
  const availW = Math.max(40, width - 16);
  const availH = Math.max(40, height - bar - caption - top);
  const aspect = 3 / 4;
  let w = availW;
  let h = w / aspect;
  if (h > availH) {
    h = availH;
    w = h * aspect;
  }
  return {
    x: (width - w) / 2,
    y: top + Math.max(0, (availH - h) / 2),
    w: w,
    h: h
  };
}

function addDisc(action, arg, x, y, r) {
  regions.push({ kind: "disc", action: action, arg: arg, x: originX + x, y: originY + y, r: r });
}

function ridge(ctx, pts, colour) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = colour;
  ctx.fill();
}

function cloud(ctx, x, y, r) {
  ctx.fillStyle = "rgba(244, 240, 228, 0.9)";
  ctx.beginPath();
  ctx.ellipse(x, y, r, r * 0.42, 0, 0, Math.PI * 2);
  ctx.ellipse(x - r * 0.45, y + r * 0.08, r * 0.55, r * 0.32, 0, 0, Math.PI * 2);
  ctx.ellipse(x + r * 0.4, y + r * 0.06, r * 0.5, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
}

function waterfall(ctx, x, y, len) {
  const w = Math.max(10, len * 0.09);
  ctx.fillStyle = "rgba(236, 242, 236, 0.9)";
  ctx.fillRect(x, y, w, len);
  ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
  ctx.fillRect(x + w * 0.35, y, w * 0.25, len);
}

function drawLandscape(ctx, w, h, nearer) {
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#efe2c4");
  sky.addColorStop(0.42, "#d5dcc8");
  sky.addColorStop(1, "#7f917f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  cloud(ctx, w * 0.22, h * 0.14, w * 0.16);
  cloud(ctx, w * 0.7, h * 0.11, w * 0.14);
  ridge(ctx, [
    [0, h * 0.46], [w * 0.1, h * 0.3], [w * 0.2, h * 0.48],
    [w * 0.3, h * 0.34], [w * 0.38, h * 0.52], [w * 0.2, h], [0, h]
  ], "#8ea090");
  ridge(ctx, [
    [w, h * 0.44], [w * 0.88, h * 0.28], [w * 0.76, h * 0.5],
    [w * 0.64, h * 0.33], [w * 0.56, h * 0.54], [w * 0.76, h], [w, h]
  ], "#6e7f72");
  waterfall(ctx, w * 0.14, h * 0.38, h * 0.2);
  waterfall(ctx, w * 0.84, h * 0.36, h * 0.18);
  if (nearer) {
    ridge(ctx, [
      [0, h * 0.7], [w * 0.14, h * 0.56], [w * 0.26, h * 0.72], [w * 0.12, h], [0, h]
    ], "#3f5348");
    ridge(ctx, [
      [w, h * 0.68], [w * 0.84, h * 0.54], [w * 0.7, h * 0.7], [w * 0.86, h], [w, h]
    ], "#31443c");
  }
  ctx.fillStyle = "#c9d2c4";
  ctx.beginPath();
  ctx.ellipse(w * 0.5, h * 0.8, w * 0.2, h * 0.035, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBuddha(ctx, cx, cy, s) {
  ctx.fillStyle = "#c47a8a";
  ctx.beginPath();
  ctx.ellipse(cx, cy + s * 0.4, s * 0.5, s * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#e7b4c0";
  ctx.beginPath();
  ctx.ellipse(cx - s * 0.28, cy + s * 0.38, s * 0.18, s * 0.07, -0.5, 0, Math.PI * 2);
  ctx.ellipse(cx + s * 0.28, cy + s * 0.38, s * 0.18, s * 0.07, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#e0c36a";
  ctx.beginPath();
  ctx.ellipse(cx, cy + s * 0.28, s * 0.32, s * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#a33b32";
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.32, cy + s * 0.24);
  ctx.lineTo(cx + s * 0.32, cy + s * 0.24);
  ctx.lineTo(cx + s * 0.18, cy - s * 0.02);
  ctx.lineTo(cx - s * 0.18, cy - s * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.18, cy);
  ctx.quadraticCurveTo(cx - s * 0.24, cy - s * 0.24, cx - s * 0.1, cy - s * 0.34);
  ctx.lineTo(cx + s * 0.1, cy - s * 0.34);
  ctx.quadraticCurveTo(cx + s * 0.24, cy - s * 0.24, cx + s * 0.18, cy);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#e0c36a";
  ctx.fillRect(cx - s * 0.12, cy - s * 0.18, s * 0.24, s * 0.055);
  ctx.fillStyle = "#e6c48a";
  ctx.beginPath();
  ctx.ellipse(cx - s * 0.15, cy - s * 0.46, s * 0.035, s * 0.07, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + s * 0.15, cy - s * 0.46, s * 0.035, s * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy - s * 0.48, s * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy - s * 0.6, s * 0.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#8a6238";
  ctx.fillRect(cx - s * 0.055, cy - s * 0.51, s * 0.028, s * 0.012);
  ctx.fillRect(cx + s * 0.027, cy - s * 0.51, s * 0.028, s * 0.012);
  ctx.beginPath();
  ctx.ellipse(cx, cy - s * 0.04, s * 0.09, s * 0.04, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawHalo(ctx, cx, cy, r, time) {
  const colours = ["#a33b32", "#c47a3a", "#e0c36a", "#6e8f62", "#6a7f92"];
  const shimmer = 0.45 + 0.2 * Math.sin(time / 650);
  const glow = ctx.createRadialGradient(cx, cy, r * 0.05, cx, cy, r);
  glow.addColorStop(0, "rgba(224, 195, 106, " + (0.35 + 0.1 * Math.sin(time / 500)) + ")");
  glow.addColorStop(1, "rgba(224, 195, 106, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  colours.forEach(function (colour, i) {
    ctx.beginPath();
    ctx.strokeStyle = colour;
    ctx.globalAlpha = shimmer;
    ctx.lineWidth = Math.max(3, r * 0.04);
    ctx.arc(cx, cy, r * (0.62 + i * 0.07), Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function paintStatic(ctx, w, h, kind) {
  if (kind === "open") {
    drawLandscape(ctx, w, h, true);
    return;
  }
  if (kind === "mist") {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#d9d3c4");
    g.addColorStop(1, "#8a8d86");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    cloud(ctx, w * 0.3, h * 0.16, w * 0.18);
    cloud(ctx, w * 0.72, h * 0.2, w * 0.12);
    return;
  }
  drawLandscape(ctx, w, h, false);
}

function drawPetals(ctx, cx, cy, radius, done, time) {
  const next = done < 5 ? done : -1;
  for (let i = 0; i < 5; i++) {
    const sway = Math.sin(time / 800 + i) * 1.5;
    const angle = -Math.PI / 2 + i * (Math.PI * 2 / 5);
    const px = cx + Math.cos(angle) * radius * 0.58;
    const py = cy + Math.sin(angle) * radius * 0.58;
    ctx.save();
    ctx.translate(px + sway, py);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 0.36, radius * 0.18, 0, 0, Math.PI * 2);
    ctx.closePath();
    if (i < done) ctx.fillStyle = "#3f6b48";
    else if (i === next) ctx.fillStyle = "#e0c36a";
    else ctx.fillStyle = "#c47a8a";
    ctx.fill();
    ctx.restore();
    addDisc(1, i + 1, px, py, Math.max(28, radius * 0.22));
  }
  ctx.beginPath();
  ctx.arc(cx, cy, 16 + done * 6, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = done >= 5 ? "#f7f4ea" : "#e0c36a";
  ctx.fill();
}

function drawPlaces(ctx, cx, cy, radius) {
  const places = [
    [0, 3, 0, "#7f91a3"],
    [Math.PI / 2, 3, 1, "#c4a24a"],
    [Math.PI, 3, 2, "#a33b32"],
    [-Math.PI / 2, 3, 3, "#3f5348"],
    [Math.PI * 0.75, 2, 0, "#8e3a3a"],
    [Math.PI * 1.2, 2, 1, "#e0c36a"]
  ];
  places.forEach(function (place) {
    const dist = place[1] === 2 ? radius * 0.92 : radius * 1.18;
    const x = cx + Math.cos(place[0]) * dist;
    const y = cy + Math.sin(place[0]) * dist;
    ctx.fillStyle = place[3];
    ctx.beginPath();
    ctx.ellipse(x, y + 6, 18, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    addDisc(place[1], place[2], x, y, 26);
  });
}

function drawWheel(ctx, cx, cy, radius, bright) {
  const colours = ["#c9c3b5", "#4a5e48", "#a89a55", "#3a4a62", "#7a4548", "#5c5550"];
  for (let i = 0; i < 6; i++) {
    const a0 = -Math.PI / 2 + i * Math.PI / 3;
    const a1 = a0 + Math.PI / 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, a0, a1);
    ctx.closePath();
    ctx.fillStyle = colours[i];
    ctx.globalAlpha = bright === i ? 1 : 0.72;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (bright === i) {
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#e0c36a";
      ctx.stroke();
    }
    const mid = (a0 + a1) / 2;
    regions.push({
      kind: "sector", action: 4, arg: i,
      cx: originX + cx, cy: originY + cy, radius: radius, a0: a0, a1: a1,
      hitX: originX + cx + Math.cos(mid) * radius * 0.62,
      hitY: originY + cy + Math.sin(mid) * radius * 0.62
    });
  }
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = "#1c1c1c";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.1, 0, Math.PI * 2);
  ctx.fillStyle = "#e0c36a";
  ctx.fill();
}

function drawMirror(ctx, w, h) {
  const cx = w / 2;
  const cy = h * 0.46;
  const rx = w * 0.28;
  const ry = h * 0.24;
  ctx.fillStyle = "#e0c36a";
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx + 8, ry + 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f7f4ea";
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  addDisc(5, 0, cx, cy, Math.min(rx, ry) * 0.85);
  ctx.fillStyle = "#d9d3c4";
  ctx.beginPath();
  ctx.ellipse(cx - rx - 36, cy + 16, 12, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#2a2a2a";
  ctx.beginPath();
  ctx.ellipse(cx + rx + 36, cy + 16, 12, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#5c4030";
  ctx.beginPath();
  ctx.ellipse(cx, cy - ry - 28, 16, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  addDisc(10, 0, cx, cy - ry - 28, 24);
  addDisc(8, 0, cx - rx - 36, cy, 28);
  addDisc(9, 0, cx + rx + 36, cy, 28);
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(cx - rx - 22, cy - 24 + i * 14, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#f4f1e6";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + rx + 22, cy - 24 + i * 14, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#1c1c1c";
    ctx.fill();
  }
  const py = cy + ry + 28;
  ctx.strokeStyle = "#5c5550";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, py, 12, 0, Math.PI * 2);
  ctx.stroke();
  addDisc(6, 0, cx, py, 22);
}

function drawRealmLight(ctx, w, h, screen) {
  const colour = REALM_WASH[screen] || "#a89a55";
  const cx = w / 2;
  const cy = h * 0.46;
  const r = Math.min(w, h) * 0.28;
  const glow = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.4);
  glow.addColorStop(0, colour);
  glow.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#e0c36a";
  ctx.lineWidth = 6;
  ctx.stroke();
}

function drawWrathful(ctx, w, h, spec) {
  const flame = spec.flame || "#c47a3a";
  ctx.strokeStyle = flame;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = Math.max(4, w * 0.02);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(w / 2, h * 0.42, Math.min(w, h) * (0.28 + i * 0.06), Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (spec.kind === "row") {
    const n = spec.figures.length;
    spec.figures.forEach(function (fig, i) {
      const x = w * (0.18 + (0.64 * i) / Math.max(1, n - 1));
      const y = h * 0.46;
      ctx.fillStyle = fig.colour;
      ctx.beginPath();
      ctx.ellipse(x, y + 18, 16, 26, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y - 16, 14, 0, Math.PI * 2);
      ctx.fill();
      addDisc(20, i, x, y, 26);
    });
    return;
  }
  const cx = w * 0.46;
  const cy = h * 0.48;
  ctx.fillStyle = spec.body;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 10, w * 0.16, h * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
  const faces = spec.faces;
  [[-22, faces[0]], [0, faces[1]], [22, faces[2]]].forEach(function (face) {
    ctx.fillStyle = face[1];
    ctx.beginPath();
    ctx.arc(cx + face[0], cy - h * 0.16, 16, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.strokeStyle = spec.body;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(cx - 30, cy);
  ctx.lineTo(cx - 58, cy - 20);
  ctx.moveTo(cx + 30, cy);
  ctx.lineTo(cx + 58, cy - 16);
  ctx.stroke();
  addDisc(20, 0, cx, cy, Math.min(w, h) * 0.16);
  const kx = w * 0.68;
  ctx.fillStyle = spec.consort;
  ctx.beginPath();
  ctx.ellipse(kx, cy + 16, w * 0.09, h * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(kx, cy - h * 0.08, 12, 0, Math.PI * 2);
  ctx.fill();
  addDisc(20, 1, kx, cy, 28);
}

function drawMark(ctx, x, y, colour, rainbow, scale) {
  const s = scale || 1;
  if (rainbow) {
    ["#E6E0D4", "#C4A24A", "#8E3A3A", "#3A6B48", "#2C4A6E"].forEach(function (band, i) {
      ctx.fillStyle = band;
      ctx.fillRect(x - 12 * s, y - 16 * s + i * 6 * s, 24 * s, 6 * s);
    });
    return;
  }
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.ellipse(x, y + 6 * s, 12 * s, 16 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y - 14 * s, 9 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(247, 244, 234, 0.35)";
  ctx.beginPath();
  ctx.arc(x - 3 * s, y - 16 * s, 2 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawBeam(ctx, x, y, light, tall) {
  const h = tall || 36;
  ctx.globalAlpha = light.withheld ? 0.45 : light.dull ? 0.75 : 0.95;
  if (light.rainbow) {
    ["#E6E0D4", "#C4A24A", "#8E3A3A", "#3A6B48", "#2C4A6E"].forEach(function (band, i) {
      ctx.fillStyle = band;
      ctx.fillRect(x - 10 + i * 4, y, 4, h);
    });
  } else {
    ctx.fillStyle = light.colour;
    ctx.fillRect(x - 7, y, 14, h);
  }
  if (light.withheld) {
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#E0C36A";
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 9, y, 18, h);
  }
  ctx.globalAlpha = 1;
}

function drawEmblem(ctx, x, y, name, colour) {
  const n = String(name || "").toLowerCase();
  ctx.fillStyle = colour || "#E0C36A";
  ctx.strokeStyle = "#F4F1E6";
  ctx.lineWidth = 2;
  if (/wheel/.test(n)) {
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI * 2 * i) / 8;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8);
      ctx.stroke();
    }
  } else if (/vajra/.test(n)) {
    ctx.beginPath();
    ctx.moveTo(x, y - 9);
    ctx.lineTo(x - 4, y);
    ctx.lineTo(x, y + 9);
    ctx.lineTo(x + 4, y);
    ctx.closePath();
    ctx.fill();
  } else if (/jewel/.test(n)) {
    ctx.beginPath();
    ctx.moveTo(x, y - 8);
    ctx.lineTo(x + 7, y);
    ctx.lineTo(x, y + 8);
    ctx.lineTo(x - 7, y);
    ctx.closePath();
    ctx.fill();
  } else if (/lotus|flower/.test(n)) {
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 * i) / 6;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 3, 5, a, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (/lion|elephant|horse|peacock|garuda|throne/.test(n)) {
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 8, y - 2, 4, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillRect(x - 6, y - 6, 12, 12);
  }
}

function drawPeace(ctx, w, h, spec) {
  ctx.fillStyle = "#12140f";
  ctx.fillRect(0, 0, w, h);
  const glow = ctx.createRadialGradient(w / 2, h * 0.46, 10, w / 2, h * 0.46, Math.max(w, h) * 0.55);
  glow.addColorStop(0, "#2c2818");
  glow.addColorStop(1, "#12140f");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  const lights = spec.lights || [];
  const wisdom = [];
  const dull = [];
  lights.forEach(function (light, i) {
    (light.dull ? dull : wisdom).push(i);
  });
  function placeRow(indexes, y, tall) {
    indexes.forEach(function (index, n) {
      const x = indexes.length === 1 ? w * 0.5 : w * (0.12 + (0.76 * n) / (indexes.length - 1));
      const light = lights[index];
      drawBeam(ctx, x, y, light, tall);
      addDisc(22, index, x, y + tall / 2, Math.max(16, tall / 2));
    });
  }
  if (wisdom.length <= 1 && dull.length <= 1) {
    wisdom.forEach(function (index) {
      drawBeam(ctx, w * 0.32, 16, lights[index], Math.min(110, h * 0.16));
      addDisc(22, index, w * 0.32, 16 + h * 0.06, 24);
    });
    dull.forEach(function (index) {
      drawBeam(ctx, w * 0.68, 16, lights[index], Math.min(110, h * 0.16));
      addDisc(22, index, w * 0.68, 16 + h * 0.06, 24);
    });
  } else {
    placeRow(wisdom, 8, 26);
    placeRow(dull, 40, 22);
  }
  const figures = spec.figures || [];
  const foot = h - 86;
  const emblemCount = (spec.emblems || []).length;
  const emblemPer = emblemCount > 8 && emblemCount <= 10 ? emblemCount : 8;
  const emblemRows = Math.max(1, Math.ceil(emblemCount / emblemPer));
  const emblemTop = foot - (emblemRows - 1) * 26;
  const bandBot = emblemTop - 34;
  const bandTop = Math.min(Math.max(120, h * 0.24), bandBot - 70);
  function bandY(frac) {
    return bandTop + (bandBot - bandTop) * frac;
  }
  if (spec.layout === "grid") {
    const cols = 7;
    const rows = Math.ceil(figures.length / cols);
    const top = 86;
    const bottom = foot - 28;
    figures.forEach(function (fig, i) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = w * (0.1 + (0.8 * col) / (cols - 1));
      const y = top + ((bottom - top) * row) / Math.max(1, rows - 1);
      drawMark(ctx, x, y, fig.colour, fig.rainbow, 0.72);
      addDisc(21, i, x, y, 14);
    });
  } else if (spec.layout === "mandala") {
    const pairAt = [
      [0.42, 0.42, 0.58, 0.46],
      [0.42, 0.08, 0.58, 0.08],
      [0.78, 0.42, 0.78, 0.62],
      [0.42, 0.78, 0.58, 0.78],
      [0.22, 0.42, 0.22, 0.62]
    ];
    for (let p = 0; p < 5; p++) {
      const spot = pairAt[p];
      const a = p * 2;
      const b = a + 1;
      if (figures[a]) {
        drawMark(ctx, w * spot[0], bandY(spot[1]), figures[a].colour, figures[a].rainbow, p === 0 ? 1.7 : 1.15);
        addDisc(21, a, w * spot[0], bandY(spot[1]), p === 0 ? 28 : 20);
      }
      if (figures[b]) {
        drawMark(ctx, w * spot[2], bandY(spot[3]), figures[b].colour, figures[b].rainbow, 0.95);
        addDisc(21, b, w * spot[2], bandY(spot[3]), 16);
      }
    }
    if (figures[10]) {
      drawMark(ctx, w * 0.5, bandY(0.98), figures[10].colour, figures[10].rainbow, 0.8);
      addDisc(21, 10, w * 0.5, bandY(0.98), 16);
    }
  } else {
    const cx = w * 0.4;
    const cy = h * 0.46;
    if (figures[0]) {
      drawMark(ctx, cx, cy, figures[0].colour, figures[0].rainbow, 2.1);
      addDisc(21, 0, cx, cy, 36);
    }
    if (figures[1]) {
      drawMark(ctx, w * 0.64, cy + 10, figures[1].colour, figures[1].rainbow, 1.45);
      addDisc(21, 1, w * 0.64, cy + 10, 24);
    }
    for (let i = 2; i < figures.length; i++) {
      const x = w * (0.16 + ((i - 2) % 4) * 0.22);
      const y = h * 0.68;
      drawMark(ctx, x, y, figures[i].colour, figures[i].rainbow, 0.95);
      addDisc(21, i, x, y, 16);
    }
  }
  const emblems = spec.emblems || [];
  const per = emblemPer;
  emblems.forEach(function (emblem, i) {
    const row = Math.floor(i / per);
    const col = i % per;
    const n = Math.min(per, emblems.length - row * per);
    const x = n === 1 ? w * 0.5 : w * (0.12 + (0.76 * col) / (n - 1));
    const y = foot - row * 26;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.7, 1.7);
    drawEmblem(ctx, 0, 0, emblem.name, emblem.colour);
    ctx.restore();
    addDisc(23, i, x, y, 16);
  });
}

function fillAwareness(ctx, w, h, time, calm) {
  const breathe = !calm && time ? Math.sin(time / 1600) * 0.05 : 0;
  const glow = ctx.createRadialGradient(
    w / 2, h * 0.4, 8,
    w / 2, h * 0.4, Math.max(w, h) * (0.58 + breathe)
  );
  glow.addColorStop(0, "#fffaf0");
  glow.addColorStop(0.22, "#f3ecda");
  glow.addColorStop(0.5, "#d5cbb2");
  glow.addColorStop(1, "#241f16");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  if (!calm && time) {
    const flicker = 0.08 + Math.sin(time / 900) * 0.04;
    const core = ctx.createRadialGradient(w / 2, h * 0.4, 4, w / 2, h * 0.4, w * 0.22);
    core.addColorStop(0, "rgba(255, 253, 248, " + flicker + ")");
    core.addColorStop(1, "rgba(255, 253, 248, 0)");
    ctx.fillStyle = core;
    ctx.fillRect(0, 0, w, h);
  }
}

function drawDissolution(ctx, w, h, stage) {
  const top = h * 0.7;
  const band = Math.max(28, h * 0.1);
  if (stage < 2) {
    const earth = stage === 0 ? band : band * 0.32;
    ctx.fillStyle = "#6b5434";
    ctx.fillRect(0, top + band - earth, w, earth);
  }
  if (stage > 0) {
    ctx.fillStyle = stage === 2 ? "#3e6270" : "rgba(62, 98, 112, 0.8)";
    ctx.fillRect(0, top, w, stage === 2 ? band : band * 0.72);
  }
  addDisc(24, 3, w / 2, top + band / 2, Math.min(w * 0.36, 90));
}

function drawClear(ctx, w, h, model, time) {
  if (model.clearKind === "secondary") {
    ctx.fillStyle = "#14120f";
    ctx.fillRect(0, 0, w, h);
    const glow = ctx.createRadialGradient(w * 0.5, h * 0.3, 8, w * 0.5, h * 0.3, w * 0.42);
    glow.addColorStop(0, "rgba(247, 244, 234, 0.62)");
    glow.addColorStop(1, "rgba(247, 244, 234, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.3, w * 0.38, 0, Math.PI * 2);
    ctx.fill();
    addDisc(24, 0, w * 0.5, h * 0.3, Math.min(w, h) * 0.16);
    [[0.2, 0.58], [0.3, 0.66], [0.16, 0.68]].forEach(function (spot, i) {
      ctx.fillStyle = i === 1 ? "#5c5348" : "#3a3630";
      ctx.beginPath();
      ctx.ellipse(w * spot[0], h * spot[1], 11, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w * spot[0], h * spot[1] - 26, 8, 0, Math.PI * 2);
      ctx.fill();
    });
    addDisc(24, 1, w * 0.23, h * 0.62, 52);
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = "#f7f4ea";
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.ellipse(w * 0.66, h * 0.58, 14, 32, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(w * 0.66, h * 0.58 - 44, 11, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    addDisc(24, 2, w * 0.66, h * 0.55, 42);
    return;
  }
  fillAwareness(ctx, w, h, time, model.clearKind === "liberation");
  if (model.clearKind === "primary") {
    addDisc(24, 0, w / 2, h * 0.4, Math.min(w, h) * 0.24);
    drawDissolution(ctx, w, h, model.dissolve);
  }
}

function drawCanon(ctx, w, h, model) {
  ctx.fillStyle = "#14160f";
  ctx.fillRect(0, 0, w, h);
  const kind = model.canon;
  if (kind === "frame" || kind === "coda") {
    const n = kind === "frame" ? 3 : 5;
    for (let i = 0; i < n; i++) {
      const y = h * (0.22 + i * (0.56 / Math.max(1, n - 1)));
      ctx.fillStyle = i === n - 1 ? "#e0c36a" : "#3a4038";
      ctx.fillRect(w * 0.18, y, w * 0.64, 18);
      addDisc(24, i, w * 0.5, y + 9, 22);
    }
    return;
  }
  if (kind === "interval") {
    const bands = ["#f7f4ea", "#c4a24a", "#7a4548"];
    bands.forEach(function (colour, i) {
      const x = w * (0.2 + i * 0.28);
      ctx.fillStyle = colour;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(x - 28, h * 0.16, 56, 22);
      ctx.globalAlpha = 1;
      addDisc(24, i, x, h * 0.16 + 11, 24);
    });
    const series = [
      [model.curves.clarity, "#f7f4ea", 3],
      [model.curves.intensity, "#e0c36a", 4],
      [model.curves.complexity, "#8e3a3a", 5]
    ];
    series.forEach(function (seriesItem) {
      const data = seriesItem[0];
      ctx.strokeStyle = seriesItem[1];
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let day = 0; day <= 49; day++) {
        const x = w * (0.12 + 0.76 * day / 49);
        const y = h * (0.78 - 0.4 * (data[day] || 0) / 1000);
        if (day === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

  }[code];

function paintAxes(ctx, width, height, marker) {
  const left = 36, right = 12, top = 16, bottom = 28;
  const plotW = Math.max(10, width - left - right);
  const plotH = Math.max(10, height - top - bottom);
  ctx.strokeStyle = "#3c4038";
  ctx.fillStyle = "#b7b1a2";
  ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left, top + plotH);
  ctx.lineTo(left + plotW, top + plotH);
  ctx.stroke();
  function line(series, colour) {
    ctx.beginPath();
    ctx.strokeStyle = colour;
    ctx.lineWidth = 1.5;
    for (let d = 0; d <= 49; d++) {
      const x = left + (d / 49) * plotW;
      const y = top + plotH - (series[d] / 1000) * plotH;
      if (d === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  line(curves.clarity, "#d9ffc3");
  line(curves.intensity, "#e0b080");
  line(curves.complexity, "#8aa4c8");
  const x = left + (marker / 49) * plotW;
  ctx.strokeStyle = "#f5e642";
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x, top + plotH);
  ctx.stroke();
}

function drawGraph(day) {
  const canvas = document.getElementById("curves");
  if (!canvas || document.getElementById("more").hidden) return;
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  const width = canvas.clientWidth || 280;
  const height = canvas.clientHeight || 120;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  paintAxes(ctx, width, height, day);
}

function modelNow() {
  const side = sidpa();
  return {
    opening: viewMode === "opening",
    ending: viewMode === "ending",
    screen: screenId,
    scene: side[0],
    methods: side[2],
    bright: side[3],
    x: side[8],
    y: side[9],
    curves: curves,
    wrath: SCREEN[screenId] && SCREEN[screenId].kind ? SCREEN[screenId] : null,
    peace: SCREEN[screenId] && SCREEN[screenId].peace ? SCREEN[screenId] : null,
    clearKind: (SCREEN[screenId] && SCREEN[screenId].clearKind) || "",
    canon: (SCREEN[screenId] && SCREEN[screenId].canon) || "",
    dissolve: dissolveStage
  };
}

function noteFrame(now) {
  frameCount += 1;
  if (frameStamp === 0) frameStamp = now;
  const span = now - frameStamp;
  if (span >= 1000) {
    fps = frameCount * 1000 / span;
    frameCount = 0;
    frameStamp = now;
  }
}

function drawCanvas() {
  paintAll(performance.now(), modelNow());
}

let looping = false;
function ensureLoop() {
  if (looping) return;
  looping = true;
  requestAnimationFrame(function tick(now) {
    if (window.__autoCover) {
      requestAnimationFrame(tick);
      return;
    }
    if (ada && screenId === "wish" && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      wanderTick = (wanderTick + 1) % 100000;
      compute();
    }
    if (ada) {
      paintAll(now, modelNow());
      noteFrame(now);
    }
    requestAnimationFrame(tick);
  });
}

function placePanels() {
  const stage = window.__stage;
  const choices = document.getElementById("choices");
  const more = document.getElementById("more");
  if (!stage || !choices || !more) return;
  const top = (stage.y + stage.h - 52) + "px";
  const left = stage.x + "px";
  const width = stage.w + "px";
  if (choices.style.top !== top) choices.style.top = top;
  if (choices.style.left !== left) choices.style.left = left;
  if (choices.style.width !== width) choices.style.width = width;
  const dissolveBox = document.getElementById("dissolve");
  if (dissolveBox) {
    const sliderTop = (stage.y + stage.h - 118) + "px";
    dissolveBox.style.top = sliderTop;
    dissolveBox.style.left = left;
    dissolveBox.style.width = width;
  }
  const panelTop = stage.y + 8;
  const choiceTop = stage.y + stage.h - 56;
  more.style.top = panelTop + "px";
  more.style.left = left;
  more.style.width = width;
  more.style.bottom = "auto";
  more.style.transform = "none";
  more.style.maxHeight = Math.max(72, choiceTop - panelTop - 8) + "px";
}

function render() {
  if (autoQuiet) return;
  const out = compute();
  updateChrome(out);
  drawCanvas();
  placePanels();
  ensureLoop();
  drawGraph(out[2]);
}

function sampleCurves() {
  const savedMilli = milli;
  const savedDir = direction;
  for (let day = 0; day <= 49; day++) {
    milli = ada.exports.bardo_milli_of_day(day);
    const out = compute();
    curves.clarity[day] = out[4];
    curves.intensity[day] = out[5];
    curves.complexity[day] = out[6];
  }
  milli = savedMilli;
  direction = savedDir;
  compute();
}

function showScreen(id, button, extra) {
  screenId = id;
  remember(button, extra);
  selectedKey = "";
  lineKey = "";
  detailKey = "";
  arrivalKey = "";
  if (button === "dont") {
    arrivalKey = forcedArrival || (REALMS.indexOf(id) >= 0 ? pullKey() : (ARRIVE[id] || ""));
  }
  forcedArrival = "";
  document.getElementById("more").hidden = true;
  if (id === "opening") {
    viewMode = "opening";
    endingLocked = false;
    turned = false;
  } else if (holdsScreen(id)) {
    viewMode = "tour";
    endingLocked = false;
    if (id !== "wish") turned = false;
    if (SCREEN[id] && Object.prototype.hasOwnProperty.call(SCREEN[id], "milli")) {
      milli = SCREEN[id].milli;
    } else if (ANCHOR[id] || (SCREEN[id] && SCREEN[id].cal)) {
      milli = ada.exports.bardo_milli_of_day(ANCHOR[id] || SCREEN[id].cal);
    }
    if (id === "c20") applyDissolve(0);
  } else {
    viewMode = "ending";
    endingLocked = true;
    turned = false;
  }
  cardsKey = "";
  render();
}

function applyDissolve(level) {
  if (!ada) return;
  const clamped = ada.exports.bardo_dissolve_clamp(level);
  dissolveStage = ada.exports.bardo_dissolve_stage(clamped);
  dissolve = clamped;
  const range = document.getElementById("dissolve-range");
  if (range && Number(range.value) !== clamped) range.value = String(clamped);
  const read = document.getElementById("dissolve-read");
  if (read) read.textContent = t("dissolve" + dissolveStage);
}

function showOpening() {
  showScreen("opening", "prev");
}

function pullKey() {
  const realm = destination >= 0 && destination <= 5
    ? destination
    : ada.exports.bardo_karma_realm(karma);
  const band = ada.exports.bardo_karma_band(karma);
  return "pull" + band + "_" + realm;
}

function rebirthId() {
  const code = ada.exports.bardo_rebirth(destination, karma);
  return REALMS[code] || "human";
}

function goStart() {
  playClick();
  methodsDone = 0;
  destination = -1;
  poisonSeen = -1;
  wanderTick = 0;
  pendingAction = 0;
  showScreen(firstId(), "start");
}

function goNext() {
  playClick();
  const list = tourList();
  const index = list.indexOf(screenId);
  if (screenId === "opening" || index < 0) {
    showScreen(direction === 0 ? "f1" : firstId(), "next");
    return;
  }
  if (index >= list.length - 1) return;
  showScreen(list[index + 1], "next");
}

function goPrev() {
  playClick();
  if (screenId === "opening") return;
  const index = tourList().indexOf(screenId);
  if (index <= 0) {
    showScreen("opening", "prev");
    return;
  }
  showScreen(tourList()[index - 1], "prev");
